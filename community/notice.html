<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공지사항 | IDP</title><link rel="stylesheet" href="../assets/css/idp-board.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body data-board="notice"><header class="top"><div class="wrap"><a class="brand" href="../index.html">국제드론순찰대<small>INTERNATIONAL DRONE PATROL</small></a><nav class="nav"><a href="notice.html" class="active">공지사항</a><a href="press.html" class="">보도자료 보기</a><a href="../pages/activities.html">활동·미디어</a><a href="../index.html">홈</a></nav></div></header><main class="wrap"><section class="hero"><div class="kicker">IDP NEWS & COMMUNITY</div><h1>공지사항</h1><p>IDP 본부의 공식 공지, 모집, 교육, 지부 운영 안내를 확인합니다.</p></section><div class="toolbar"><input id="q" class="input" placeholder="제목·내용 검색"><select id="sort" class="select"><option value="latest">최신순</option><option value="views">조회순</option><option value="likes">공감순</option></select></div><div id="list" class="cards"></div><div id="pager" class="pager"></div></main><script src="../assets/js/idp-board.js"></script><script>
let page=1;const size=12,board=document.body.dataset.board;async function load(){let query=idpdb.from('idp_board_posts').select('id,title,summary,author_name,is_pinned,published_at,created_at,view_count,like_count,comment_count',{count:'exact'}).eq('board_type',board).eq('is_published',true);const q=document.querySelector('#q').value.trim();if(q)query=query.or(`title.ilike.%${q}%,summary.ilike.%${q}%,content.ilike.%${q}%`);const sort=document.querySelector('#sort').value;if(sort==='views')query=query.order('view_count',{ascending:false});else if(sort==='likes')query=query.order('like_count',{ascending:false});else query=query.order('is_pinned',{ascending:false}).order('published_at',{ascending:false});const from=(page-1)*size;const {data,count,error}=await query.range(from,from+size-1);if(error){console.error('IDP board load error:',error);document.querySelector('#list').innerHTML='<div class="empty">게시판 연결 오류가 발생했습니다.<br><small>'+esc(error.message||'잠시 후 다시 시도해 주세요.')+'</small></div>';return}document.querySelector('#list').innerHTML=(data||[]).map(x=>`<a class="post-card" href="post.html?id=${x.id}"><div class="badge">${x.is_pinned?'📌 중요':(board==='press'?'PRESS':'NOTICE')}</div><div><h3>${esc(x.title)}</h3><div class="meta"><span>${esc(x.author_name||'IDP 본부')}</span><span>${fmt(x.published_at||x.created_at)}</span><span>조회 ${x.view_count||0}</span><span>공감 ${x.like_count||0}</span><span>댓글 ${x.comment_count||0}</span></div></div><div>›</div></a>`).join('')||'<div class="empty">등록된 글이 없습니다.</div>';const pages=Math.max(1,Math.ceil((count||0)/size));document.querySelector('#pager').innerHTML=Array.from({length:pages},(_,i)=>`<button ${i+1===page?'disabled':''} data-p="${i+1}">${i+1}</button>`).join('')}
document.querySelector('#q').addEventListener('input',()=>{page=1;load()});document.querySelector('#sort').onchange=()=>{page=1;load()};document.querySelector('#pager').onclick=e=>{if(e.target.dataset.p){page=+e.target.dataset.p;load();scrollTo(0,0)}};load();</script></body></html>
