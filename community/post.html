<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDP 게시글</title><link rel="stylesheet" href="../assets/css/idp-board.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
.social-login{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}.btn.social{font-weight:800;padding:12px 18px;border-radius:10px}.btn.google{background:#fff;color:#202124;border:1px solid #dadce0}.btn.kakao{background:#FEE500;color:#191919;border:1px solid #FEE500}.email-fallback{margin:6px 0 10px;color:#9fb0c3}.email-fallback summary{cursor:pointer;font-size:13px}.loginbox{display:flex;gap:8px;flex-wrap:wrap}.sessionbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:14px 0 0;min-height:42px}.sessionbar .who{color:#9fb0c3;font-size:13px}.logout-btn{background:#172536;color:#fff;border:1px solid #435368;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer}.logout-btn:hover{border-color:#f3b63f;color:#f3b63f}@media(max-width:640px){.btn.social{flex:1 1 100%}.sessionbar{justify-content:flex-start;flex-wrap:wrap}}
</style></head><body><header class="top"><div class="wrap"><a class="brand" href="../index.html">국제드론순찰대<small>INTERNATIONAL DRONE PATROL</small></a><nav class="nav"><a href="notice.html">공지사항</a><a href="press.html">보도자료</a><a href="../index.html">홈</a></nav></div></header><main class="wrap"><section class="hero"><div class="kicker">IDP OFFICIAL BOARD</div></section><div id="topSession" class="sessionbar"></div><article id="article" class="article"><div class="empty">불러오는 중...</div></article><div class="reactionbar" id="reactions"></div><section class="comments"><h2>댓글</h2><div id="authbox"></div><div id="commentForm" hidden><input id="nickname" class="input" maxlength="30" placeholder="표시 이름"><textarea id="comment" class="textarea" rows="4" maxlength="1000" placeholder="댓글을 입력하세요"></textarea><button id="submitComment" class="btn primary">댓글 등록</button></div><div id="comments"></div></section></main><script src="../assets/js/idp-board.js"></script><script>
const id=new URLSearchParams(location.search).get('id');let me=null;async function loadPost(){const {data,error}=await idpdb.from('idp_board_posts').select('*').eq('id',id).eq('is_published',true).single();if(error||!data){article.innerHTML='<div class="empty">게시글을 찾을 수 없습니다.</div>';return}document.title=data.title+' | IDP';article.innerHTML=`<div class="badge">${data.board_type==='press'?'PRESS RELEASE':'NOTICE'}</div><h1>${esc(data.title)}</h1><div class="meta"><span>${esc(data.author_name||'IDP 본부')}</span><span>${fmt(data.published_at||data.created_at)}</span><span>조회 ${data.view_count||0}</span></div>${data.summary?`<p style="color:#aebaca;font-weight:700">${esc(data.summary)}</p>`:''}<div class="content">${esc(data.content)}</div>`;await idpdb.rpc('idp_increment_post_view',{p_post_id:id});await loadReactions();await loadComments()}
async function loadReactions(){const {data}=await idpdb.from('idp_board_reactions').select('reaction_type,user_id').eq('post_id',id);const rows=data||[],types=[['like','👍 좋아요'],['support','💪 응원'],['thanks','🙏 감사']];reactions.innerHTML=types.map(([k,l])=>{const n=rows.filter(x=>x.reaction_type===k).length,on=me&&rows.some(x=>x.reaction_type===k&&x.user_id===me.user.id);return `<button class="react ${on?'on':''}" data-r="${k}">${l} ${n}</button>`}).join('')}
async function loadComments(){const {data}=await idpdb.from('idp_board_comments').select('*').eq('post_id',id).eq('is_deleted',false).order('created_at');comments.innerHTML=(data||[]).map(x=>`<div class="comment"><div><span class="author">${esc(x.author_name||'회원')}</span> <span class="meta">${fmt(x.created_at)}</span></div><div class="body">${esc(x.content)}</div></div>`).join('')||'<div class="empty">첫 댓글을 남겨보세요.</div>'}
async function auth(){
  me=await session();
  if(me){
    const label=me.user.user_metadata?.full_name||me.user.user_metadata?.name||me.user.email||'회원';
    const provider=me.user.app_metadata?.provider||'login';
    const providerLabel=provider==='google'?'Google':provider==='kakao'?'Kakao':'로그인';
    topSession.innerHTML=`<span class="who"><strong>${esc(label)}</strong> · ${providerLabel} 로그인 중</span><button id="topLogout" class="logout-btn">로그아웃</button>`;
    authbox.innerHTML=`<div class="meta"><strong>${esc(label)}</strong> 로그인 중 · 댓글과 공감 기능을 사용할 수 있습니다.</div>`;
    commentForm.hidden=false;
    document.querySelector('#topLogout').onclick=async()=>{await idpdb.auth.signOut();location.href=location.pathname+location.search};
  }else{
    topSession.innerHTML='';
    commentForm.hidden=true;
    authbox.innerHTML=`<div class="social-login"><button id="googleLogin" class="btn social google">Google로 계속하기</button><button id="kakaoLogin" class="btn social kakao">카카오로 계속하기</button></div><details class="email-fallback"><summary>이메일로 로그인</summary><div class="loginbox" style="margin-top:10px"><input id="email" class="input" type="email" placeholder="이메일 주소"><button id="login" class="btn">인증메일 받기</button></div></details><div class="meta">댓글·좋아요·응원·감사는 로그인 후 이용할 수 있습니다.</div>`;
    googleLogin.onclick=async()=>{const {error}=await socialLogin('google',location.href);if(error)alert('Google 로그인 연결에 실패했습니다.')};
    kakaoLogin.onclick=async()=>{const {error}=await socialLogin('kakao',location.href);if(error)alert('카카오 로그인 연결에 실패했습니다.')};
    login.onclick=async()=>{const e=email.value.trim();if(!e)return alert('이메일을 입력하세요.');const {error}=await otp(e,location.href);alert(error?'인증메일 발송 실패':'인증메일을 보냈습니다.')};
  }
}
reactions.onclick=async e=>{const b=e.target.closest('[data-r]');if(!b)return;if(!me)return alert('Google 또는 카카오 로그인이 필요합니다.');const r=b.dataset.r;const {data}=await idpdb.from('idp_board_reactions').select('id').eq('post_id',id).eq('user_id',me.user.id).eq('reaction_type',r).maybeSingle();if(data)await idpdb.from('idp_board_reactions').delete().eq('id',data.id);else await idpdb.from('idp_board_reactions').insert({post_id:id,user_id:me.user.id,reaction_type:r});loadReactions()};submitComment.onclick=async()=>{if(!me)return;const content=comment.value.trim(),author_name=nickname.value.trim()||me.user.email.split('@')[0];if(!content)return;const {error}=await idpdb.from('idp_board_comments').insert({post_id:id,user_id:me.user.id,author_name,content});if(error)return alert('댓글 등록 실패');comment.value='';loadComments()};(async()=>{await auth();await loadPost()})();</script><script src="../assets/js/idp-global-lang.js"></script>
</body></html>
