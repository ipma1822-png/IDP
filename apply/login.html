<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>대원 로그인 | 국제드론순찰대</title><link rel="stylesheet" href="../assets/css/style.css"><style>
body{background:#070b11}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:100px 18px}.login-card{width:min(520px,100%);background:#0d1420;border:1px solid #394151;border-radius:20px;padding:34px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.login-card h1{margin:8px 0 10px;color:#fff}.login-card p{color:#aeb8c6;line-height:1.7}.kakao-btn{width:100%;border:0;border-radius:12px;background:#FEE500;color:#191919;padding:15px 18px;font-size:1rem;font-weight:900;cursor:pointer;margin-top:18px}.back{display:block;text-align:center;margin-top:14px;color:#c9d0db}.who{margin-top:18px;padding:14px;border:1px solid #2d3a4b;border-radius:12px;color:#e8edf5}.gold{color:#e0bd60;font-weight:900}.small{font-size:.86rem}
</style></head><body><main class="login-wrap"><section class="login-card"><div class="gold">IDP MEMBER LOGIN</div><h1>카카오로 간편 로그인</h1><p>비밀번호를 만들 필요가 없습니다. 카카오 인증으로 IDP 회원 서비스를 이용하세요.</p><button id="kakaoLogin" class="kakao-btn">카카오로 계속하기</button><div id="sessionBox"></div><a class="back" href="member.html">← 대원 가입으로 돌아가기</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0');
const btn=document.getElementById('kakaoLogin'), box=document.getElementById('sessionBox');
btn.onclick=async()=>{const {error}=await db.auth.signInWithOAuth({provider:'kakao',options:{redirectTo:location.origin+'/apply/login.html'}});if(error)alert('카카오 로그인 연결에 실패했습니다.');};
(async()=>{const {data}=await db.auth.getSession();const s=data.session;if(s){btn.style.display='none';box.innerHTML='<div class="who"><b>로그인 완료</b><br><span class="small">'+(s.user.email||'카카오 인증 사용자')+'</span><br><br><a class="btn btn-gold" href="../index.html">IDP 홈으로 이동</a></div>';}})();
</script><script src="../assets/js/version.js"></script></body></html>
