<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDP 전문트랙 신청</title><link rel="stylesheet" href="../assets/css/style.css"><style>.subpage{min-height:100vh;padding:130px 0 70px}.box{max-width:760px;margin:auto;background:#0d131d;border:1px solid #2c394c;border-radius:20px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field input,.field select,.field textarea{background:#080d14;border:1px solid #344156;border-radius:10px;color:white;padding:12px}.field textarea{min-height:110px}.wide{grid-column:1/-1}.btn{border:0;border-radius:10px;padding:13px 18px;background:#d2aa4c;color:#080c11;font-weight:900;cursor:pointer}.status{min-height:26px;color:#9ca9b8}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header class="subpage-header"><div class="container header-inner"><a class="brand" href="../index.html"><img src="../assets/images/logo/IDP008.png" alt="IDP"><span><strong>국제드론순찰대</strong><small>INTERNATIONAL DRONE PATROL</small></span></a></div></header><main class="subpage"><div class="container box"><p class="section-kicker">SPECIALIST APPLICATION</p><h1>MARTIAL / DRONE 전문트랙 신청</h1><p style="color:#9eabba">YOUTH 번호 또는 승인된 일반대원 번호 중 하나를 입력하세요. 경력은 관리자 확인 후 전문트랙으로 승인됩니다.</p><form id="form" class="grid"><label class="field"><span>신청자 구분</span><select id="ownerType"><option value="YOUTH">YOUTH</option><option value="MEMBER">일반대원</option></select></label><label class="field"><span>YOUTH/대원 번호</span><input id="ownerCode" required placeholder="IDP-Y-2026-... 또는 IDP-KR-..."></label><label class="field"><span>전문트랙</span><select id="track"><option value="MARTIAL">🥋 MARTIAL</option><option value="DRONE">🚁 DRONE</option></select></label><label class="field"><span>전문분야</span><input id="specialty" required placeholder="예: 태권도 / 태권검도 / 드론 1종"></label><label class="field"><span>현재 단·급 / 자격</span><input id="qualification" placeholder="예: 태권도 4단 / 초경량비행장치 자격"></label><label class="field"><span>발급·인증기관</span><input id="issuer" placeholder="예: 국기원 / 발급기관"></label><label class="field wide"><span>주요 경력·활동</span><textarea id="experience" placeholder="경력과 활동내용을 간단히 적어주세요."></textarea></label><button class="btn wide">전문트랙 신청하기</button></form><p id="status" class="status"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),$=s=>document.querySelector(s);$('#form').onsubmit=async e=>{e.preventDefault();$('#status').textContent='신청 중...';const {data,error}=await db.rpc('idp_submit_specialist_application',{p_owner_type:$('#ownerType').value,p_owner_code:$('#ownerCode').value.trim().toUpperCase(),p_track_type:$('#track').value,p_specialty:$('#specialty').value.trim(),p_qualification:$('#qualification').value.trim(),p_issuer:$('#issuer').value.trim(),p_experience:$('#experience').value.trim()});if(error){console.error(error);$('#status').textContent='신청하지 못했습니다. 번호와 입력내용을 확인해 주세요.';return}$('#status').textContent=`신청 완료 · ${data?.application_code||'접수완료'}`;$('#form').reset()}})();</script><script src="../assets/js/version.js"></script></body></html>
