s/junior.html">안내로 돌아가기</a></div><p id="status" class="status"></p></form></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),form=document.getElementById('form'),status=document.getElementById('status'),center=document.getElementById('center');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function centers(){const {data,error}=await db.rpc('idp_list_youth_centers');if(error){console.error(error);return}center.innerHTML='<option value="">공식센터 미지정 · 추후 배정</option>'+((data||[]).map(x=>`<option value="${x.center_id}">${esc(x.sido)} ${esc(x.sigungu)} ${esc(x.eupmyeondong)} · ${esc(x.center_name)} · ${esc(x.cert_grade)}</option>`).join(''))}form.addEventListener('submit',async e=>{e.preventDefault();if(!form.checkValidity()){form.reportValidity();return}const f=new FormData(form),btn=form.querySelector('button');btn.disabled=true;status.className='status';status.textContent='가입을 접수하고 있습니다...';const payload={p_group_type:f.get('group_type'),p_name:String(f.get('name')||'').trim(),p_birth_date:f.get('birth_date'),p_phone:String(f.get('phone')||'').trim(),p_email:String(f.get('email')||'').trim(),p_guardian_name:String(f.get('guardian_name')||'').trim(),p_guardian_phone:String(f.get('guardian_phone')||'').trim(),p_center_id:f.get('center_id')?Number(f.get('center_id')):null,p_consent_guardian:!!f.get('guardian'),p_consent_privacy:!!f.get('privacy')};const {data,error}=await db.rpc('idp_submit_youth_application',payload);btn.disabled=false;if(error){console.error(error);status.className='status err';status.textContent='접수 중 오류가 발생했습니다. 입력내용을 확인해 주세요.';return}const code=data&&data.youth_code;status.className='status ok';status.innerHTML=`가입 신청이 완료되었습니다. 발급된 IDP YOUTH 번호는 <strong>${esc(code)}</strong> 입니다. 승인 후 MY IDP에서 조회할 수 있습니다.`;form.reset();centers()});centers()})();
