</style></head><body><header class="subpage-header"><div class="container header-inner"><a class="brand" href="../index.html"><img src="../assets/images/logo/IDP008.png" alt="IDP"><span><strong>국제드론순찰대</strong><small>INTERNATIONAL DRONE PATROL</small></span></a><a class="top-cta" href="center-search.html">우리동네 IDP</a></div></header><main class="subpage"><div class="container shell"><section class="hero"><div class="eyebrow">IDP OFFICIAL CENTER RANKING</div><h1>전국 공식센터 활동 랭킹</h1><p>회원 숫자만이 아니라 청소년 참여, 실제 미션, 봉사활동을 함께 반영한 활동지수 순위입니다. 먼저 지정받는 것만큼, 꾸준히 활동하는 것이 중요합니다.</p><div class="filter"><select id="sido"><option value="">전국 전체</option><option>서울특별시</option><option>부산광역시</option><option>대구광역시</option><option>인천광역시</option><option>광주광역시</option><option>대전광역시</option><option>울산광역시</option><option>세종특별자치시</option><option>경기도</option><option>강원특별자치도</option><option>충청북도</option><option>충청남도</option><option>전북특별자치도</option><option>전라남도</option><option>경상북도</option><option>경상남도</option><option>제주특별자치도</option></select><button id="loadBtn">순위 보기</button></div></section><div class="grid"><section class="panel"><h2 id="rankTitle">전국 TOP 10</h2><div id="rankList" class="ranklist"><div class="empty">순위를 불러오는 중입니다...</div></div></section><section class="panel"><h2>이번 달 성장센터</h2><div id="growthList" class="ranklist"><div class="empty">성장 기록을 불러오는 중입니다...</div></div><div class="actions"><a class="btn primary" href="../apply/center.html">우리지역 공식센터 신청</a><a class="btn" href="center-search.html">우리동네 조회</a></div></section></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function card(x,i,growth=false){const cls=i<3?' top'+(i+1):'',url=`center-detail.html?code=${encodeURIComponent(x.center_code)}`;return `<div class="rank${cls}"><div class="pos">${growth?'▲':'#'}${i+1}</div><div class="name"><a href="${url}"><strong>${esc(x.center_name)}</strong></a><small>${esc(x.sido)} ${esc(x.sigungu)} ${esc(x.eupmyeondong)}</small><div class="summary"><span class="pill">${esc(x.cert_grade)}</span><span class="pill">대원 ${Number(x.member_count||0).toLocaleString()}</span><span class="pill">미션 ${Number(x.mission_count||0).toLocaleString()}</span><span class="pill">봉사 ${Number(x.volunteer_hours||0).toLocaleString()}h</span></div></div><div class="score"><strong class="${growth?'growth':''}">${growth?'+'+Number(x.growth_score||0):Number(x.activity_score||0)+'점'}</strong><small>${growth?'이번 달 활동지수 성장':'활동지수'}</small></div></div>`}async function ranks(){const sido=$('#sido').value||null;$('#rankTitle').textContent=sido?`${sido} TOP 10`:'전국 TOP 10';$('#rankList').innerHTML='<div class="empty">순위를 불러오는 중입니다...</div>';const {data,error}=await db.rpc('idp_get_center_rankings',{p_sido:sido,p_limit:10});if(error){console.error(error);$('#rankList').innerHTML='<div class="empty">v4.2.0 Supabase SQL을 먼저 실행해 주세요.</div>';return}$('#rankList').innerHTML=(data||[]).map((x,i)=>card(x,i,false)).join('')||'<div class="empty">아직 순위에 표시할 공식센터가 없습니다.</div>'}async function growth(){const {data,error}=await db.rpc('idp_get_growth_centers',{p_limit:10});if(error){console.error(error);$('#growthList').innerHTML='<div class="empty">성장 데이터가 아직 준비되지 않았습니다.</div>';return}$('#growthList').innerHTML=(data||[]).map((x,i)=>card(x,i,true)).join('')||'<div class="empty">지난달과 비교할 실적이 쌓이면 성장센터가 표시됩니다.</div>'}$('#
