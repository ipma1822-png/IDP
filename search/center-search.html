.subpage{min-height:100vh;padding:140px 0 80px}.shell{max-width:1120px;margin:auto}.hero,.searchbox,.result{background:#0d131d;border:1px solid #293345;border-radius:20px}.hero{padding:42px}.hero h1{font-size:clamp(2.1rem,5vw,3.8rem);margin:.2em 0}.hero p{color:#aeb7c4;line-height:1.8}.eyebrow{color:#d8b15a;font-weight:900;letter-spacing:.12em}.searchbox{padding:24px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid input,.grid select{width:100%;box-sizing:border-box;background:#080c12;color:#fff;border:1px solid #334052;border-radius:10px;padding:13px;font:inherit}.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.btnx{display:inline-flex;justify-content:center;align-items:center;padding:13px 18px;border-radius:10px;border:0;background:#d0a94d;color:#080b10;font-weight:900;text-decoration:none;cursor:pointer}.btnx.secondary{background:#111823;color:#e8edf5;border:1px solid #334052}.result{padding:24px;margin-top:18px}.empty{color:#9ba7b7;line-height:1.7}.center-card{padding:22px;background:#090e16;border:1px solid #37445a;border-radius:14px}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#1d2b1f;border:1px solid #4f7b57;color:#a9e5b4;font-size:.78rem;font-weight:900}.center-card h2{margin:10px 0 4px;color:#f2d77f}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.meta div{padding:12px;background:#0d131d;border-radius:10px}.meta small{display:block;color:#8792a1}.meta strong{display:block;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.stat{padding:12px 8px;text-align:center;background:#111923;border:1px solid #28364a;border-radius:12px}.stat strong{display:block;color:#f2d77f;font-size:1.25rem}.stat span{display:block;color:#8d99a9;font-size:.72rem;margin-top:4px}.grade{color:#fff!important}.open{border-color:#4b8358}.open h2{color:#9de3aa}@media(max-width:760px){.subpage{padding-top:118px}.hero{padding:24px 18px} <main class="subpage"><div class="container shell"><section class="hero"><div class="eyebrow">FIND MY LOCAL IDP</div><h1>우리동네 IDP 공식센터</h1><p>우리 지역에 IDP 본부가 승인한 공식센터가 있는지 확인할 수 있습니다. 읍·면·동 단위로 원칙상 1개의 활성 공식센터만 지정됩니다.</p></section><section class="searchbox"><div class="grid"><select id="sido"><option value="">시·도 선택</option><option>서울특별시</option><option>부산광역시</option><option>대구광역시</option><option>인천광역시</option><option>광주광역시</option><option>대전광역시</option><option>울산광역시</option><option>세종특별자치시</option><option>경기도</option><option>강원특별자치도</option><option>충청북도</option><option>충청남도</option><option>전북특별자치도</option><option>전라남도</option><option>경상북도</option><option>경상남도</option><option>제주특별자치도</option></select><input id="sigungu" placeholder="시·군·구 예: 남구"><input id="dong" placeholder="읍·면·동 예: 신정동"></div><div class="actions"><button id="searchBtn" class="btnx">우리동네 조회</button><a href="center-ranking.html" class="btnx secondary">전국 센터 랭킹</a><a href="../apply/center.html" class="btnx secondary">공식센터 선점 신청</a></div></section><section id="result" class="result"><div class="empty">지역을 입력하고 조회해 주세요.</div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),r=document.getElementById('result');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.getElementById('searchBtn').onclick=async()=>{const sido=document.getElementById('sido').value.trim(),sigungu=document.getElementById('sigungu').value.trim(),dong=document.getElementById('dong').value.trim();if(!sido||!sigungu||!dong){r.innerHTML='<div class="empty">시·도, 시·군·구, 읍·면·동을 모두 입력해 주세요.</div>';return}r.innerHTML='<div class="empty">공식센터 지정현황을 확인 중입니다...</div>';const {data,error}=await db.rpc('idp_find_official_center',{p_sido:sido,p_sigungu:sigungu,p_eupmyeondong:dong});if(error){console.error(error);r.innerHTML='<div class="empty">조회 기능을 사용하려면 먼저 제공된 Supabase SQL을 실행해 주세요.</div>';return}if(data&&data.length){const x=data[0],detail=`center-detail.html?code=${encodeURIComponent(x.center_code)}`;r.innerHTML=`<div class="center-card"><span class="badge">IDP OFFICIAL CENTER</span><h2>${esc(x.center_name)}</h2><p>${esc(x.sido)} ${esc(x.sigungu)} ${esc(x.eupmyeondong)} 공식 지정센터</p><div class="stats"><div class="stat"><strong>${Number(x.member_count||0).toLocaleString()}</strong><span>센터 대원</span></div><div class="stat"><strong>${Number(x.youth_count||0).toLocaleString()}</strong><span>청소년</span></div><div class="stat"><strong>${Number(x.mission_count||0).toLocaleString()}</strong><span>미션</span></div><div class="stat"><strong>${Number(x.volunteer_hours||0).toLocaleString()}</strong><span>봉사시간</span></div><div class="stat"><strong class="grade">${esc(x.cert_grade||'STARTER')}</strong><span>인증등급</span></div></div><div class="meta"><div><small>공식 지정번호</small><strong>${esc(x.center_code)}</strong></div><div><small>센터장</small><strong>${esc(x.director_name||'-')}</strong></div><div><small>기관유형</small><strong>${esc(x.center_type_label||'-')}</strong></div><div><small>지정기간</small><strong>${esc(x.valid_from||'-')} ~ ${esc(x.valid_until||'-')}</strong></div></div><div class="actions"><a class="btnx" href="${detail}">공식센터 상세보기</a></div></div>`}else{r.innerHTML=`<div class="center-card open"><span class="badge">AVAILABLE AREA</span><h2>현재 지정 가능한 지역입니다.</h2><p>${esc(sido)} ${esc(sigungu)} ${esc(dong)}에는 승인된 IDP 공식센터가 없습니다.</p><div class="actions"><a class="btnx" href="../apply/center.html?sido=${encodeURIComponent(sido)}&sigungu=${encodeURIComponent(sigungu)}&dong=${encodeURIComponent(dong)}">이 지역 공식센터 신청</a></div></div>`}};const p=new URLSearchParams(location.search);['sido','sigungu'].forEach(k=>{if(p.get(k))document.getElementById(k).value=p.get(k)});if(p.get('dong'))document.getElementById('dong').value=p.get('dong')})();
</script><script src="../assets/js/version.js"></script></body></html>
