<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDP 봉사활동센터</title><link rel="stylesheet" href="../assets/css/style.css"><style>
.subpage{min-height:100vh;padding:130px 0 80px}.shell{max-width:1120px;margin:auto}.hero{background:linear-gradient(145deg,#0f1b27,#0a1119);border:1px solid #314158;border-radius:24px;padding:28px}.hero h1{margin:.2rem 0;color:#f0d177}.notice{color:#9eabba;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}.card{background:#0b121b;border:1px solid #2f3e52;border-radius:18px;padding:20px}.tag{display:inline-block;padding:5px 9px;border:1px solid #40506a;border-radius:999px;font-size:.75rem;color:#d7e2ee}.tag.g{color:#93e4aa;border-color:#2c6840}.card h3{margin:11px 0}.meta{color:#98a5b5;line-height:1.7;font-size:.9rem}.btn{border:0;border-radius:10px;background:#d1aa4d;color:#091018;font-weight:900;padding:11px 15px;cursor:pointer}.btn.line{background:#111925;color:white;border:1px solid #37465c}.apply{margin-top:14px;display:none;background:#080e15;border:1px solid #344158;border-radius:12px;padding:14px}.apply.show{display:block}.apply input{width:100%;box-sizing:border-box;background:#060b11;color:white;border:1px solid #354258;border-radius:9px;padding:11px;margin:6px 0}.status{min-height:22px;color:#9ca9b9}.empty{text-align:center;padding:40px;color:#91a0b2}@media(max-width:720px){.cards{grid-template-columns:1fr}.hero{padding:20px 15px}}
</style></head><body><header class="subpage-header"><div class="container header-inner"><a class="brand" href="../index.html"><img src="../assets/images/logo/IDP008.png" alt="IDP"><span><strong>국제드론순찰대</strong><small>INTERNATIONAL DRONE PATROL</small></span></a><a class="top-cta" href="my-idp.html">MY IDP</a></div></header><main class="subpage"><div class="container shell"><section class="hero"><small style="color:#d8b75f">IDP VOLUNTEER CENTER</small><h1>안전·봉사활동센터</h1><p class="notice">드론이 없어도 참여할 수 있습니다. 활동별 1365 연계 여부는 공식 절차와 관할 자원봉사센터 기준에 따라 별도로 표시됩니다. IDP 내부 활동시간과 1365 인정시간은 구분하여 관리합니다.</p></section><div id="cards" class="cards"></div><div id="msg" class="empty">활동을 불러오는 중입니다...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),cards=document.getElementById('cards'),msg=document.getElementById('msg');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>v?new Date(v).toLocaleString('ko-KR'):'-';async function load(){const {data,error}=await db.rpc('idp_list_volunteer_programs');if(error){console.error(error);msg.textContent='봉사활동 DB를 확인해 주세요.';return}const arr=data||[];msg.style.display=arr.length?'none':'block';msg.textContent=arr.length?'':'현재 모집 중인 봉사활동이 없습니다.';cards.innerHTML=arr.map(x=>`<article class="card"><span class="tag ${x.link_1365?'g':''}">${x.link_1365?'1365 연계 예정/가능':'IDP 공식 공익활동'}</span><h3>${esc(x.title)}</h3><div class="meta">${esc(x.center_name||'IDP 중앙/지역 활동')}<br>${dt(x.start_at)} ~ ${dt(x.end_at)}<br>${esc(x.location||'장소 추후 공지')} · 모집 ${Number(x.capacity||0)||'제한없음'}명<br>대상 ${esc(x.target_groups||'KIDS/JUNIOR/YOUTH')}</div><p>${esc(x.description||'')}</p><button class="btn" data-open="${x.program_code}">참가신청</button><div class="apply" id="a-${x.program_code}"><input placeholder="IDP YOUTH 번호 예: IDP-Y-2026-000001" id="y-${x.program_code}"><button class="btn line" data-apply="${x.program_code}">신청하기</button><div class="status" id="s-${x.program_code}"></div></div></article>`).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>document.getElementById('a-'+b.dataset.open).classList.toggle('show'));document.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>apply(b.dataset.apply))}async function apply(code){const input=document.getElementById('y-'+code),status=document.getElementById('s-'+code),y=input.value.trim().toUpperCase();if(!y){status.textContent='YOUTH 번호를 입력해 주세요.';return}status.textContent='신청 중...';const {data,error}=await db.rpc('idp_apply_volunteer_program',{p_program_code:code,p_youth_code:y});if(error){console.error(error);status.textContent=String(error.message||'').includes('ALREADY_APPLIED')?'이미 신청한 활동입니다.':String(error.message||'').includes('CAPACITY_FULL')?'모집인원이 마감되었습니다.':'신청할 수 없습니다. 번호와 활동대상을 확인해 주세요.';return}status.textContent='신청 완료 · 상태 '+(data?.status||'applied')}load()})();
</script><script src="../assets/js/version.js"></script></body></html>
