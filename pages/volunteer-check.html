<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDP 봉사 QR 출석</title><link rel="stylesheet" href="../assets/css/style.css"><style>.subpage{min-height:100vh;padding:135px 0 80px}.box{max-width:650px;margin:auto;background:#0d141e;border:1px solid #34435a;border-radius:22px;padding:26px}.mode{font-size:2rem;color:#efd276;font-weight:900}.box input{width:100%;box-sizing:border-box;margin:16px 0;background:#080e15;border:1px solid #3a485e;border-radius:10px;padding:14px;color:white}.btn{width:100%;border:0;border-radius:10px;padding:14px;background:#d1aa4d;color:#081018;font-weight:900}.status{min-height:55px;padding-top:16px;color:#a7b3c1;line-height:1.6}</style></head><body><header class="subpage-header"><div class="container header-inner"><a class="brand" href="../index.html"><img src="../assets/images/logo/IDP008.png" alt="IDP"><span><strong>국제드론순찰대</strong><small>VOLUNTEER QR</small></span></a></div></header><main class="subpage"><div class="container"><section class="box"><small style="color:#d8b75f">IDP QR ATTENDANCE</small><div id="mode" class="mode">QR 확인</div><h2 id="title">봉사활동 출석</h2><p>본인 YOUTH 번호를 입력해 주세요. QR 체크 기록은 IDP 내부 출석 증빙이며 담당자 최종승인 후 활동시간이 확정됩니다.</p><input id="code" placeholder="IDP-Y-2026-000001"><button id="go" class="btn">확인</button><div id="status" class="status"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),qs=new URLSearchParams(location.search),program=qs.get('p')||'',token=qs.get('t')||'',mode=(qs.get('m')||'').toLowerCase(),status=document.getElementById('status');document.getElementById('mode').textContent=mode==='out'?'CHECK OUT · 활동종료':'CHECK IN · 활동시작';document.getElementById('go').onclick=async()=>{const y=document.getElementById('code').value.trim().toUpperCase();if(!program||!token||!['in','out'].includes(mode)){status.textContent='유효하지 않은 QR입니다.';return}if(!y){status.textContent='YOUTH 번호를 입력해 주세요.';return}status.textContent='확인 중...';const {data,error}=await db.rpc('idp_volunteer_qr_check',{p_program_code:program,p_youth_code:y,p_mode:mode,p_token:token});if(error){console.error(error);const m=String(error.message||'');status.textContent=m.includes('NOT_APPLIED')?'먼저 해당 봉사활동에 참가신청을 해 주세요.':m.includes('INVALID_QR')?'유효하지 않거나 만료된 QR입니다.':m.includes('CHECKIN_REQUIRED')?'먼저 체크인해야 합니다.':'처리할 수 없습니다. 담당자에게 확인해 주세요.';return}status.textContent=(mode==='in'?'체크인':'체크아웃')+' 완료 · '+new Date(data.checked_at).toLocaleString('ko-KR')+'\n담당자 최종승인 후 봉사시간이 확정됩니다.'}})();
</script><script src="../assets/js/version.js"></script></body></html>
