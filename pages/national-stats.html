<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDP 전국 통계 · 공식센터 평가</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#071019;color:#eef4fa}.subpage{min-height:100vh;padding:120px 0 70px}.shell{max-width:1180px;margin:auto}.hero{background:linear-gradient(135deg,#0c1724,#111d2c);border:1px solid #2c3b50;border-radius:22px;padding:26px;margin-bottom:18px}.kicker{color:#d9b75c;font-weight:900}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:18px 0}.stat{background:#0c1520;border:1px solid #27384c;border-radius:15px;padding:16px}.stat b{display:block;font-size:1.55rem;color:#fff}.stat span{color:#9fb0c2;font-size:.82rem}.panel{background:#0c1520;border:1px solid #27384c;border-radius:18px;padding:20px;margin-top:15px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select{background:#08111a;color:#fff;border:1px solid #34475e;border-radius:9px;padding:10px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:930px}.table th,.table td{padding:11px;border-bottom:1px solid #243247;text-align:left}.rank{font-weight:900;color:#e2bd5c}.grade{display:inline-block;border:1px solid #b89544;color:#f1ce70;border-radius:999px;padding:4px 9px;font-weight:850}.bar{height:8px;background:#1e2a38;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#d3ad4e}.small{font-size:.8rem;color:#94a5b7}.empty{padding:25px;text-align:center;color:#91a1b2}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="subpage-header"><div class="container header-inner"><a class="brand" href="../index.html"><span><strong>국제드론순찰대</strong><small>INTERNATIONAL DRONE PATROL</small></span></a></div></header><main class="subpage"><div class="container shell"><section class="hero"><div class="kicker">IDP NATIONAL IMPACT DATA</div><h1>전국 활동통계 · 공식센터 평가</h1><p>실제 IDP 시스템에 승인된 공식센터, YOUTH, 봉사활동, 1365 연계, MARTIAL·DRONE 전문트랙 데이터를 기준으로 집계합니다.</p><div id="stats" class="stats"></div></section><section class="panel"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><h2>공식센터 활동평가</h2><div class="small">활동지수와 공공사업 준비도를 함께 확인합니다.</div></div><div class="filters"><select id="sido"><option value="">전국</option></select></div></div><div class="table"><table><thead><tr><th>순위</th><th>공식센터</th><th>지역</th><th>인증등급</th><th>활동지수</th><th>공공사업 준비도</th><th>봉사</th><th>1365 완료</th><th>전문트랙</th></tr></thead><tbody id="rows"></tbody></table></div><div id="msg" class="empty"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sido=['서울특별시','부산광역시','대구광역시','인천광역시','광주광역시','대전광역시','울산광역시','세종특별자치시','경기도','강원특별자치도','충청북도','충청남도','전북특별자치도','전라남도','경상북도','경상남도','제주특별자치도'];sido.forEach(x=>$('#sido').insertAdjacentHTML('beforeend',`<option>${x}</option>`));async function load(){const area=$('#sido').value||null;$('#msg').textContent='통계를 불러오는 중...';const[a,b]=await Promise.all([db.rpc('idp_get_national_dashboard'),db.rpc('idp_get_center_evaluation',{p_sido:area,p_limit:100})]);if(a.error||b.error){console.error(a.error||b.error);$('#msg').textContent='통계 조회에 실패했습니다.';return}const x=(a.data||[])[0]||{},cards=[['공식센터',x.active_centers||0],['YOUTH',x.active_youth||0],['승인 봉사시간',Number(x.volunteer_hours||0).toFixed(1)],['1365 완료시간',Number(x.completed_1365_hours||0).toFixed(1)],['MARTIAL',x.martial_tracks||0],['DRONE',x.drone_tracks||0]];$('#stats').innerHTML=cards.map(c=>`<div class="stat"><b>${esc(c[1])}</b><span>${esc(c[0])}</span></div>`).join('');const rows=b.data||[];$('#rows').innerHTML=rows.map((r,i)=>`<tr><td class="rank">${i+1}</td><td><b>${esc(r.center_name)}</b><div class="small">${esc(r.center_code)}</div></td><td>${esc([r.sido,r.sigungu,r.eupmyeondong].filter(Boolean).join(' '))}</td><td><span class="grade">${esc(r.cert_grade)}</span></td><td>${r.activity_score}/100<div class="bar"><i style="width:${Math.min(100,Number(r.activity_score||0))}%"></i></div></td><td><b>${r.readiness_score}/100</b><div class="small">${esc(r.readiness_grade)}</div></td><td>${Number(r.volunteer_hours||0).toFixed(1)}시간</td><td>${Number(r.completed_1365_hours||0).toFixed(1)}시간</td><td>M ${r.martial_count} · D ${r.drone_count}</td></tr>`).join('');$('#msg').textContent=rows.length?'':'조건에 맞는 공식센터가 없습니다.'}$('#sido').onchange=load;load()})();</script><script src="../assets/js/version.js"></script></body></html>
