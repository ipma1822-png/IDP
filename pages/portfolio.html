<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDP 활동 포트폴리오</title><link rel="stylesheet" href="../assets/css/style.css"><style>.subpage{min-height:100vh;padding:130px 0 70px}.shell{max-width:950px;margin:auto}.search{display:flex;gap:10px;padding:16px;background:#0d131d;border:1px solid #2c394c;border-radius:16px}.search input{flex:1;background:#080d14;border:1px solid #344156;border-radius:9px;color:white;padding:12px}.btn{border:0;border-radius:9px;padding:11px 15px;background:#d2aa4c;color:#080c11;font-weight:900;cursor:pointer}.btn.alt{background:#131c28;color:#fff;border:1px solid #35445a}.paper{margin-top:18px;background:#fff;color:#17202a;border-radius:18px;padding:34px;display:none}.paper.show{display:block}.head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #182331;padding-bottom:18px}.title{font-size:2rem;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stat{background:#f2f4f7;border-radius:10px;padding:13px;text-align:center}.stat strong{display:block;font-size:1.3rem}.section{margin-top:22px}.track{border:1px solid #d7dce2;border-radius:10px;padding:13px;margin:8px 0}.badges{display:flex;gap:8px;flex-wrap:wrap}.badge{border:1px solid #d6dbe1;border-radius:999px;padding:7px 10px}.vol{border-bottom:1px solid #e2e5e9;padding:9px 0}.tools{margin-top:12px;display:flex;gap:8px}.msg{color:#9ba7b6;text-align:center;padding:24px}@media(max-width:700px){.search{flex-direction:column}.grid{grid-template-columns:1fr 1fr}.paper{padding:20px}.head{flex-direction:column}}@media print{body{background:#fff}.subpage{padding:0}.search,.tools,.subpage-header,.msg{display:none!important}.paper{display:block!important;box-shadow:none;padding:0}.shell{max-width:none}}</style></head><body><header class="subpage-header"><div class="container header-inner"><a class="brand" href="../index.html"><img src="../assets/images/logo/IDP008.png" alt="IDP"><span><strong>국제드론순찰대</strong><small>INTERNATIONAL DRONE PATROL</small></span></a></div></header><main class="subpage"><div class="container shell"><p class="section-kicker">IDP ACTIVITY PORTFOLIO</p><h1>활동 포트폴리오</h1><div class="search"><input id="code" placeholder="YOUTH 번호 또는 일반대원 번호"><button id="go" class="btn">포트폴리오 조회</button></div><div class="tools"><button id="print" class="btn alt">인쇄 / PDF</button></div><div id="msg" class="msg"></div><article id="paper" class="paper"></article></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const code=$('#code').value.trim().toUpperCase();if(!code){$('#msg').textContent='번호를 입력해 주세요.';return}$('#msg').textContent='포트폴리오를 만드는 중...';$('#paper').classList.remove('show');const {data,error}=await db.rpc('idp_get_public_portfolio',{p_owner_code:code});if(error||!data){console.error(error);$('#msg').textContent='승인된 기록을 찾을 수 없습니다.';return}const x=data,tracks=x.tracks||[],badges=x.badges||[],vols=x.volunteer_records||[];$('#msg').textContent='';$('#paper').classList.add('show');$('#paper').innerHTML=`<div class="head"><div><div class="title">IDP ACTIVITY PORTFOLIO</div><div>국제드론순찰대 · INTERNATIONAL DRONE PATROL</div></div><div><b>${esc(x.display_name)}</b><br>${esc(x.owner_code)}</div></div><div class="grid"><div class="stat"><strong>${esc(x.group_type||x.member_type||'IDP')}</strong><span>구분</span></div><div class="stat"><strong>${Number(x.level_no||0)}</strong><span>YOUTH LEVEL</span></div><div class="stat"><strong>${Number(x.volunteer_hours||0).toFixed(1)}</strong><span>봉사시간</span></div><div class="stat"><strong>${tracks.length}</strong><span>전문트랙</span></div></div><div class="section"><h3>소속</h3><div>${esc(x.center_name||'공식센터 미지정')} ${x.center_location?`· ${esc(x.center_location)}`:''}</div></div><div class="section"><h3>MARTIAL / DRONE 전문트랙</h3>${tracks.length?tracks.map(t=>`<div class="track"><b>${t.track_type==='MARTIAL'?'🥋':'🚁'} ${esc(t.track_type)} · LEVEL ${t.track_level}</b><div>${esc(t.specialty||'')} · ${esc(t.qualification||'')}</div><small>${esc(t.issuer||'')} ${t.approved_at?'· 승인 '+new Date(t.approved_at).toLocaleDateString('ko-KR'):''}</small></div>`).join(''):'<div>승인된 전문트랙이 없습니다.</div>'}</div><div class="section"><h3>BADGES</h3><div class="badges">${badges.length?badges.map(b=>`<span class="badge">${esc(b.badge_icon)} ${esc(b.badge_name)}</span>`).join(''):'획득 배지 없음'}</div></div><div class="section"><h3>봉사·공익활동</h3>${vols.length?vols.map(v=>`<div class="vol"><b>${esc(v.title)}</b> · ${Number(v.approved_hours||0).toFixed(1)}시간 <small>${v.start_at?new Date(v.start_at).toLocaleDateString('ko-KR'):''}${v.status_1365==='completed'?' · 1365 등록완료':''}</small></div>`).join(''):'<div>승인된 봉사활동 기록이 없습니다.</div>'}</div><div class="section"><small>본 포트폴리오는 IDP 시스템에 승인·기록된 활동을 기준으로 생성되었습니다.</small></div>`}$('#go').onclick=load;$('#print').onclick=()=>window.print();$('#code').onkeydown=e=>{if(e.key==='Enter')load()};const q=new URLSearchParams(location.search).get('code');if(q){$('#code').value=q;load()}})();</script><script src="../assets/js/version.js"></script></body></html>
