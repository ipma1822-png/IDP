<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY IDP | 국제드론순찰대</title><link rel="stylesheet" href="../assets/css/style.css"><style>
.subpage{min-height:100vh;padding:135px 0 80px}.shell{max-width:940px;margin:auto}.search{display:flex;gap:10px;background:#0d131d;border:1px solid #2d394b;border-radius:18px;padding:18px}.search input{flex:1;background:#090e16;border:1px solid #344157;border-radius:10px;color:white;padding:13px;font:inherit}.search button{border:0;border-radius:10px;background:#d1a94c;color:#080c11;font-weight:900;padding:0 18px}.profile{margin-top:18px;background:linear-gradient(145deg,#101925,#0a1018);border:1px solid #35445b;border-radius:22px;padding:26px}.hidden{display:none}.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.code{color:#8391a4}.name{font-size:2.2rem;color:#f2d77f;margin:7px 0}.level{display:inline-flex;align-items:center;padding:9px 13px;border-radius:999px;background:#221d0e;border:1px solid #6f5a28;color:#f2d77f;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat{background:#090f17;border:1px solid #2f3c50;border-radius:14px;padding:17px;text-align:center}.stat strong{display:block;font-size:1.45rem}.stat span{color:#8290a1;font-size:.78rem}.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.badge{background:#0a111a;border:1px solid #314058;border-radius:14px;padding:16px;text-align:center}.badge i{font-style:normal;font-size:2rem}.badge b{display:block;margin-top:7px}.badge small{color:#8290a1}.empty{padding:30px;text-align:center;color:#94a0b0}@media(max-width:720px){.search{flex-direction:column}.search button{padding:13px}.stats{grid-template-columns:1fr}.badges{grid-template-columns:1fr 1fr}.profile{padding:20px 15px}}
</style></head><body><header class="subpage-header"><div class="container header-inner"><a class="brand" href="../index.html"><img src="../assets/images/logo/IDP008.png" alt="IDP"><span><strong>국제드론순찰대</strong><small>INTERNATIONAL DRONE PATROL</small></span></a><a class="top-cta" href="junior.html">YOUTH</a></div></header><main class="subpage"><div class="container shell"><p class="section-kicker">MY IDP GROWTH CARD</p><h1>나의 IDP</h1><p style="color:#9eabba">승인된 YOUTH 번호를 입력하면 LEVEL, 소속센터와 획득 배지를 확인할 수 있습니다. 개인정보는 공개하지 않습니다.</p><div class="search"><input id="code" placeholder="예: IDP-Y-2026-000001"><button id="go">조회</button></div><section id="profile" class="profile hidden"></section><div id="msg" class="empty"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),code=document.getElementById('code'),go=document.getElementById('go'),box=document.getElementById('profile'),msg=document.getElementById('msg');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const v=code.value.trim().toUpperCase();if(!v){msg.textContent='YOUTH 번호를 입력해 주세요.';return}msg.textContent='조회 중입니다...';box.classList.add('hidden');const [{data,error},{data:badges}]=await Promise.all([db.rpc('idp_get_youth_card',{p_youth_code:v}),db.rpc('idp_get_youth_badges',{p_youth_code:v})]);if(error||!data||!data.length){console.error(error);msg.textContent='승인된 YOUTH 기록을 찾을 수 없습니다.';return}const x=data[0],bs=badges||[];msg.textContent='';box.classList.remove('hidden');box.innerHTML=`<div class="top"><div><div class="code">${esc(x.youth_code)} · ${esc(x.group_type)}</div><div class="name">${esc(x.display_name)}</div><div>${x.center_name?`${esc(x.sido)} ${esc(x.sigungu)} ${esc(x.eupmyeondong)} · ${esc(x.center_name)}`:'소속센터 미지정'}</div></div><div class="level">LEVEL ${Number(x.level_no||1)}</div></div><div class="stats"><div class="stat"><strong>${Number(x.level_no||1)}</strong><span>현재 LEVEL</span></div><div class="stat"><strong>${Number(x.xp||0).toLocaleString()}</strong><span>성장 XP</span></div><div class="stat"><strong>${Number(x.badge_count||0)}</strong><span>획득 BADGE</span></div></div><h3>MY BADGES</h3><div class="badges">${bs.length?bs.map(b=>`<div class="badge"><i>${esc(b.badge_icon)}</i><b>${esc(b.badge_name)}</b><small>${esc(b.description||'')}</small></div>`).join(''):'<div class="empty" style="grid-column:1/-1">아직 획득한 배지가 없습니다. 첫 활동부터 하나씩 채워보세요.</div>'}</div>`}go.addEventListener('click',load);code.addEventListener('keydown',e=>{if(e.key==='Enter')load()});const q=new URLSearchParams(location.search).get('code');if(q){code.value=q;load()}})();
</script><script src="../assets/js/version.js"></script></body></html>
