<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>IDP 전문트랙 관리자</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#070b11;color:#eef2f7}.wrap{max-width:1350px;margin:auto;padding:100px 18px 60px}.panel{background:#0d131d;border:1px solid #293548;border-radius:16px;padding:20px}.login{max-width:520px;margin:60px auto}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select{background:#080d14;border:1px solid #344156;border-radius:9px;color:#fff;padding:11px}.btn{border:1px solid #344156;background:#121a26;color:#fff;border-radius:9px;padding:10px 13px;font-weight:850;cursor:pointer}.gold{background:#d1aa4d;color:#080c11;border:0}.dash{display:none}.dash.show{display:block}.table{overflow:auto;background:#0d131d;border:1px solid #293548;border-radius:14px}.table table{width:100%;border-collapse:collapse;min-width:1050px}.table th,.table td{padding:10px;border-bottom:1px solid #243044;text-align:left}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:9999;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{width:min(760px,100%);background:#0d131d;border:1px solid #3a485e;border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{min-height:24px;color:#9ba7b7}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section id="login" class="panel login"><h2>IDP 전문트랙 관리자</h2><form id="loginForm"><label class="field">관리자 이메일<input id="email" type="email" required></label><button class="btn gold">인증메일 받기</button><p id="loginStatus" class="status"></p></form></section><section id="dash" class="dash"><div style="display:flex;justify-content:space-between;gap:10px;align-items:end"><div><small style="color:#d8b75f">SPECIALIST ADMIN</small><h1>MARTIAL · DRONE 전문트랙</h1></div><button id="logout" class="btn">로그아웃</button></div><div class="table"><table><thead><tr><th>접수일</th><th>번호</th><th>구분</th><th>트랙</th><th>전문분야</th><th>자격/단급</th><th>상태</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div><p id="status" class="status"></p></section></main><div id="modal" class="modal"><div class="box"><div style="display:flex;justify-content:space-between"><h2 id="title">상세</h2><button id="close" class="btn">닫기</button></div><div class="grid"><label class="field">상태<select id="mStatus"><option value="pending">심사중</option><option value="approved">승인</option><option value="hold">보류</option><option value="rejected">반려</option></select></label><label class="field">전문 LEVEL<select id="mLevel"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></label><label class="field">전문분야<input id="mSpecialty"></label><label class="field">자격/단급<input id="mQualification"></label><label class="field">인증기관<input id="mIssuer"></label><label class="field">공개여부<select id="mPublic"><option value="true">공개</option><option value="false">비공개</option></select></label></div><p id="mStatusText" class="status"></p><button id="save" class="btn gold">저장</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),ADMIN='jeonseongkweon@gmail.com',$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[],cur=null;async function enter(s){if(!s||String(s.user?.email||'').toLowerCase()!==ADMIN){$('#login').style.display='block';$('#dash').classList.remove('show');return}$('#login').style.display='none';$('#dash').classList.add('show');await load()}$('#loginForm').onsubmit=async e=>{e.preventDefault();const email=$('#email').value.trim().toLowerCase();if(email!==ADMIN){$('#loginStatus').textContent='관리자 이메일을 입력해 주세요.';return}const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:'https://idp.ai.kr/admin/idp-specialists.html',shouldCreateUser:false}});$('#loginStatus').textContent=error?'발송 실패':'인증메일을 보냈습니다.'};async function load(){const {data,error}=await db.rpc('idp_admin_list_specialist_applications');if(error){console.error(error);$('#status').textContent='전문트랙 DB를 확인해 주세요.';return}rows=data||[];$('#rows').innerHTML=rows.map(r=>`<tr><td>${new Date(r.created_at).toLocaleDateString('ko-KR')}</td><td>${esc(r.owner_code)}</td><td>${esc(r.owner_type)}</td><td>${r.track_type==='MARTIAL'?'🥋':'🚁'} ${esc(r.track_type)}</td><td>${esc(r.specialty)}</td><td>${esc(r.qualification||'-')}</td><td>${esc(r.status)}</td><td><button class="btn" data-id="${r.id}">관리</button></td></tr>`).join('');$('#rows').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(Number(b.dataset.id)));$('#status').textContent=`총 ${rows.length}건`}function open(id){cur=rows.find(r=>r.id===id);if(!cur)return;$('#title').textContent=`${cur.owner_code} · ${cur.track_type}`;$('#mStatus').value=cur.status;$('#mLevel').value=String(cur.track_level||1);$('#mSpecialty').value=cur.specialty||'';$('#mQualification').value=cur.qualification||'';$('#mIssuer').value=cur.issuer||'';$('#mPublic').value=String(cur.is_public!==false);$('#modal').classList.add('show')}$('#save').onclick=async()=>{if(!cur)return;$('#mStatusText').textContent='저장 중...';const {error}=await db.rpc('idp_admin_update_specialist_application',{p_application_id:cur.id,p_status:$('#mStatus').value,p_track_level:Number($('#mLevel').value),p_specialty:$('#mSpecialty').value.trim(),p_qualification:$('#mQualification').value.trim(),p_issuer:$('#mIssuer').value.trim(),p_is_public:$('#mPublic').value==='true'});if(error){console.error(error);$('#mStatusText').textContent='저장 실패';return}$('#mStatusText').textContent='저장되었습니다.';await load()};$('#close').onclick=()=>$('#modal').classList.remove('show');$('#logout').onclick=async()=>{await db.auth.signOut();enter(null)};db.auth.onAuthStateChange((_e,s)=>enter(s));db.auth.getSession().then(({data})=>enter(data.session))})();</script><script src="../assets/js/version.js"></script></body></html>
