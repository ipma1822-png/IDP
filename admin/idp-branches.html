<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>IDP 지부 통합관리</title><link rel="stylesheet" href="../assets/css/style.css"><style>
body{background:#070b11;color:#edf1f6}.admin{max-width:1240px;margin:auto;padding:35px 18px 80px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.top h1{margin:0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button,.btnx{background:#111823;color:#e8edf5;border:1px solid #334052;border-radius:9px;padding:11px 14px;cursor:pointer}.tabs button.active,.gold{border-color:#b38f3d;color:#f0ce73}.panel{display:none}.panel.show{display:block}.box{background:#0d131d;border:1px solid #293345;border-radius:14px;padding:20px;margin-top:14px}.login{max-width:480px;margin:100px auto}input,select,textarea{width:100%;box-sizing:border-box;background:#080c12;color:#fff;border:1px solid #334052;border-radius:8px;padding:11px}label{display:grid;gap:6px;color:#c8d0db}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{padding:11px 8px;border-bottom:1px solid #273040;text-align:left;vertical-align:top}th{color:#d9ba64}.status{min-height:23px;margin-top:10px;color:#d9ba64}.officer-editor{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.officer{background:#090e16;border:1px solid #273040;border-radius:12px;padding:14px}.officer h3{color:#e4c56d;font-size:.95rem}.officer label{margin-top:8px}@media(max-width:800px){.grid,.officer-editor{grid-template-columns:1fr}.table-wrap{overflow:auto}}</style></head><body><main class="admin"><section id="login" class="box login"><h1>IDP 지부 통합관리</h1><p>관리자 계정으로 로그인하세요.</p><form id="loginForm"><label>이메일<input id="email" type="email" required></label><label style="margin-top:10px">비밀번호<input id="pw" type="password" required></label><button class="btnx gold" style="margin-top:14px">로그인</button></form><p id="loginStatus" class="status"></p></section><section id="dash" hidden><div class="top"><div><small style="color:#d9ba64">IDP ADMIN CENTER</small><h1>지부 통합관리</h1></div><div><a class="btnx" href="idp-members.html">대원관리</a> <button id="logout" class="btnx">로그아웃</button></div></div><div class="tabs"><button data-tab="apps" class="active">지부 설립 신청</button><button data-tab="org">17개 시·도 조직 수정</button></div>
<div id="apps" class="panel show"><div class="box"><div class="grid"><label>상태<select id="filter"><option value="">전체</option><option value="pending">심사중</option><option value="approved">승인</option><option value="hold">보류</option><option value="rejected">반려</option></select></label><label>검색<input id="q" placeholder="지역·신청자·이메일"></label></div><div class="table-wrap"><table><thead><tr><th>접수일</th><th>구분</th><th>지역</th><th>신청자</th><th>연락</th><th>인원</th><th>상태</th><th>처리</th></tr></thead><tbody id="tbody"></tbody></table></div><p id="appStatus" class="status"></p></div></div>
<div id="org" class="panel"><div class="box"><div class="grid"><label>지역 선택<select id="regionSelect"><option value="seoul">서울특별시</option><option value="busan">부산광역시</option><option value="daegu">대구광역시</option><option value="incheon">인천광역시</option><option value="gwangju">광주광역시</option><option value="daejeon">대전광역시</option><option value="ulsan">울산광역시</option><option value="sejong">세종특별자치시</option><option value="gyeonggi">경기도</option><option value="gangwon">강원특별자치도</option><option value="chungbuk">충청북도</option><option value="chungnam">충청남도</option><option value="jeonbuk">전북특별자치도</option><option value="jeonnam">전라남도</option><option value="gyeongbuk">경상북도</option><option value="gyeongnam">경상남도</option><option value="jeju">제주특별자치도</option></select></label><label>조직 상태<select id="orgStatus"><option value="building">조직 구축</option><option value="active">운영중</option><option value="recruiting">임원 모집중</option></select></label></div><p>각 직책에 승인된 임원의 정보를 입력하세요. 비어 있으면 홈페이지에는 ‘공석 · 모집중’으로 표시됩니다.</p><div id="officerEditor" class="officer-editor"></div><button id="saveOrg" class="btnx gold" style="margin-top:14px">조직정보 저장</button><p id="orgMsg" class="status"></p></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0');const roles=["시·도 본부장", "부본부장", "사무국장", "교육위원장", "드론운영위원장", "안전·봉사위원장", "홍보위원장", "청소년위원장", "지역협력위원장"];let apps=[];const $=s=>document.querySelector(s);function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function setDash(on){$('#login').hidden=on;$('#dash').hidden=!on}async function init(){const {data}=await db.auth.getSession();if(data.session){setDash(true);await loadApps();await loadOrg()}}$('#loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pw').value});if(error){$('#loginStatus').textContent='로그인에 실패했습니다.';return}setDash(true);await loadApps();await loadOrg()};$('#logout').onclick=async()=>{await db.auth.signOut();setDash(false)};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('show',x.id===b.dataset.tab))});async function loadApps(){const {data,error}=await db.from('idp_branch_applications').select('*').order('created_at',{ascending:false});if(error){$('#appStatus').textContent='지부 신청 테이블을 불러올 수 없습니다. SQL 설정을 확인하세요.';return}apps=data||[];render()}function render(){const q=$('#q').value.toLowerCase(),f=$('#filter').value;const list=apps.filter(x=>(!f||x.status===f)&&(!q||[x.region,x.applicant_name,x.email,x.country].join(' ').toLowerCase().includes(q)));$('#tbody').innerHTML=list.map(x=>`<tr><td>${new Date(x.created_at).toLocaleDateString('ko-KR')}</td><td>${esc(x.branch_level)}</td><td><strong>${esc(x.country)} · ${esc(x.region)}</strong><br><small>${esc(x.plan)}</small></td><td>${esc(x.applicant_name)}</td><td>${esc(x.phone)}<br>${esc(x.email)}</td><td>${esc(x.expected_members||'-')}</td><td><select data-status="${x.id}"><option value="pending" ${x.status==='pending'?'selected':''}>심사중</option><option value="approved" ${x.status==='approved'?'selected':''}>승인</option><option value="hold" ${x.status==='hold'?'selected':''}>보류</option><option value="rejected" ${x.status==='rejected'?'selected':''}>반려</option></select></td><td><button class="btnx" data-save="${x.id}">저장</button></td></tr>`).join('')}$('#q').oninput=render;$('#filter').onchange=render;$('#tbody').onclick=async e=>{const b=e.target.closest('[data-save]');if(!b)return;const id=Number(b.dataset.save),sel=document.querySelector(`[data-status="${id}"]`);const {error}=await db.from('idp_branch_applications').update({status:sel.value}).eq('id',id);if(error)alert('저장 실패');else{const x=apps.find(a=>a.id===id);x.status=sel.value;alert('저장되었습니다.')}};
function renderOfficer(data=[]){$('#officerEditor').innerHTML=roles.map((role,i)=>{const o=data.find(x=>x.role===role)||{};return `<div class="officer" data-role="${esc(role)}"><h3>${esc(role)}</h3><label>성명<input data-k="name" value="${esc(o.name||'')}"></label><label>사진 URL<input data-k="photo_url" value="${esc(o.photo_url||'')}"></label><label>전화<input data-k="phone" value="${esc(o.phone||'')}"></label><label>이메일<input data-k="email" value="${esc(o.email||'')}"></label><label>담당지역<input data-k="area" value="${esc(o.area||'')}"></label></div>`}).join('')}async function loadOrg(){const slug=$('#regionSelect').value;const {data}=await db.from('idp_branch_officers').select('*').eq('region_slug',slug);renderOfficer(data||[])}$('#regionSelect').onchange=loadOrg;$('#saveOrg').onclick=async()=>{const slug=$('#regionSelect').value;$('#orgMsg').textContent='저장 중...';const rows=[...document.querySelectorAll('.officer')].map((c,i)=>{const get=k=>c.querySelector(`[data-k="${k}"]`).value.trim()||null;return{region_slug:slug,role:c.dataset.role,name:get('name'),photo_url:get('photo_url'),phone:get('phone'),email:get('email'),area:get('area'),is_public:true,sort_order:i+1,updated_at:new Date().toISOString()}});const {error}=await db.from('idp_branch_officers').upsert(rows,{onConflict:'region_slug,role'});if(error){console.error(error);$('#orgMsg').textContent='저장에 실패했습니다. 권한 또는 SQL 설정을 확인하세요.'}else $('#orgMsg').textContent='17개 시·도 조직정보가 저장되었습니다.'};const param=new URLSearchParams(location.search).get('region');if(param&&[...$('#regionSelect').options].some(o=>o.value===param))$('#regionSelect').value=param;init();})();</script><script src="../assets/js/version.js"></script></body></html>
