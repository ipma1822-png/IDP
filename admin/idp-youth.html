<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>IDP YOUTH 관리</title><link rel="stylesheet" href="../assets/css/style.css"><style>
body{background:#070b11;color:#eef2f7}.wrap{max-width:1450px;margin:auto;padding:105px 18px 60px}.panel{background:#0d131d;border:1px solid #293548;border-radius:18px;padding:20px}.login{max-width:520px;margin:70px auto}.field{display:grid;gap:7px;margin:12px 0}.field input,.field select{background:#080d14;border:1px solid #334055;border-radius:9px;color:white;padding:12px}.btn{border:1px solid #344156;border-radius:9px;background:#121a26;color:white;padding:10px 13px;font-weight:850;cursor:pointer}.gold{background:#d1aa4d;color:#090d12;border:0}.dash{display:none}.dash.show{display:block}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#0d131d;border:1px solid #293548;border-radius:13px;padding:15px}.stat strong{display:block;font-size:1.7rem;color:#efd274}.table{overflow:auto;background:#0d131d;border:1px solid #293548;border-radius:16px}.table table{width:100%;border-collapse:collapse;min-width:1100px}.table th,.table td{padding:11px;border-bottom:1px solid #243044;text-align:left}.table th{color:#9ca8b8;font-size:.8rem}.badge{padding:5px 8px;border-radius:999px;border:1px solid #3b4a60;font-size:.75rem}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:9999;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalbox{width:min(900px,100%);max-height:92vh;overflow:auto;background:#0d131d;border:1px solid #3b495e;border-radius:18px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.badges label{border:1px solid #344156;border-radius:11px;padding:11px;background:#091018}.status{min-height:24px;color:#9aa6b5}.ok{color:#8fe0a5}.err{color:#ff9f9f}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.badges{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><section id="login" class="panel login"><h2>IDP YOUTH 관리자</h2><form id="loginForm"><label class="field"><span>관리자 이메일</span><input id="email" type="email" required></label><button class="btn gold">인증 메일 받기</button><p id="loginStatus" class="status"></p></form></section><section id="dash" class="dash"><div class="head"><div><small style="color:#d8b75f">IDP YOUTH ADMIN</small><h1>KIDS · JUNIOR · YOUTH 관리</h1></div><div><button id="refresh" class="btn">새로고침</button> <button id="logout" class="btn">로그아웃</button></div></div><div class="stats"><div class="stat"><small>전체</small><strong id="all">0</strong></div><div class="stat"><small>KIDS</small><strong id="kids">0</strong></div><div class="stat"><small>JUNIOR</small><strong id="junior">0</strong></div><div class="stat"><small>YOUTH</small><strong id="youth">0</strong></div></div><div class="table"><table><thead><tr><th>접수일</th><th>YOUTH 번호</th><th>구분</th><th>이름</th><th>공식센터</th><th>LEVEL</th><th>상태</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div><p id="dashStatus" class="status"></p></section></main><div id="modal" class="modal"><div class="modalbox"><div style="display:flex;justify-content:space-between"><h2 id="title">YOUTH 상세</h2><button id="close" class="btn">닫기</button></div><div class="grid"><label class="field">상태<select id="status"><option value="pending">심사중</option><option value="active">활성</option><option value="hold">보류</option><option value="rejected">반려</option></select></label><label class="field">LEVEL<select id="level"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label class="field">XP<input id="xp" type="number" min="0"></label><label class="field">소속센터<select id="center"><option value="">미지정</option></select></label></div><h3>배지 수여</h3><div id="badges" class="badges"></div><p id="modalStatus" class="status"></p><button id="save" class="btn gold">저장</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),ADMIN='jeonseongkweon@gmail.com',q=s=>document.querySelector(s);let data=[],centers=[],badgeMaster=[],current=null,currentBadges=new Set();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function enter(session){if(!session||String(session.user?.email||'').toLowerCase()!==ADMIN){q('#login').style.display='block';q('#dash').classList.remove('show');return}q('#login').style.display='none';q('#dash').classList.add('show');await load()}q('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const email=q('#email').value.trim().toLowerCase();if(email!==ADMIN){q('#loginStatus').textContent='관리자 이메일을 입력해 주세요.';return}const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:'https://idp.ai.kr/admin/idp-youth.html',shouldCreateUser:false}});q('#loginStatus').textContent=error?'인증메일 발송 실패':'인증메일을 보냈습니다.'});async function load(){q('#dashStatus').textContent='불러오는 중...';const [a,c,b]=await Promise.all([db.from('idp_youth_profiles').select('*,idp_official_centers(center_name,center_code,sido,sigungu,eupmyeondong)').order('created_at',{ascending:false}),db.rpc('idp_list_youth_centers'),db.from('idp_badges').select('*').eq('is_active',true).order('sort_order')]);if(a.error){console.error(a.error);q('#dashStatus').textContent='YOUTH DB 권한을 확인해 주세요.';return}data=a.data||[];centers=c.data||[];badgeMaster=b.data||[];q('#all').textContent=data.length;q('#kids').textContent=data.filter(x=>x.group_type==='KIDS').length;q('#junior').textContent=data.filter(x=>x.group_type==='JUNIOR').length;q('#youth').textContent=data.filter(x=>x.group_type==='YOUTH').length;q('#rows').innerHTML=data.map(x=>`<tr><td>${new Date(x.created_at).toLocaleDateString('ko-KR')}</td><td>${esc(x.youth_code)}</td><td>${esc(x.group_type)}</td><td>${esc(x.name)}</td><td>${x.idp_official_centers?esc(x.idp_official_centers.center_name):'-'}</td><td>${x.level_no}</td><td><span class="badge">${esc(x.status)}</span></td><td><button class="btn" data-id="${x.id}">관리</button></td></tr>`).join('');q('#dashStatus').textContent=`총 ${data.length}명`;q('#rows').querySelectorAll('[data-id]').forEach(btn=>btn.onclick=()=>open(Number(btn.dataset.id)))}async function open(id){current=data.find(x=>x.id===id);if(!current)return;q('#title').textContent=`${current.name} · ${current.youth_code}`;q('#status').value=current.status;q('#level').value=String(current.level_no);q('#xp').value=current.xp||0;q('#center').innerHTML='<option value="">미지정</option>'+centers.map(c=>`<option value="${c.center_id}">${esc(c.sido)} ${esc(c.sigungu)} ${esc(c.eupmyeondong)} · ${esc(c.center_name)}</option>`).join('');q('#center').value=current.center_id||'';const {data:owned}=await db.from('idp_youth_badges').select('badge_id').eq('youth_id',id);currentBadges=new Set((owned||[]).map(x=>x.badge_id));q('#badges').innerHTML=badgeMaster.map(b=>`<label><input type="checkbox" data-badge="${esc(b.badge_code)}" data-bid="${b.id}" ${currentBadges.has(b.id)?'checked':''}> ${esc(b.badge_icon)} ${esc(b.badge_name)}</label>`).join('');q('#modal').classList.add('show');q('#modalStatus').textContent=''}q('#save').onclick=async()=>{if(!current)return;q('#modalStatus').textContent='저장 중...';const payload={p_youth_id:current.id,p_status:q('#status').value,p_level_no:Number(q('#level').value),p_xp:Number(q('#xp').value||0),p_center_id:q('#center').value?Number(q('#center').value):null};const {error}=await db.rpc('idp_admin_update_youth',payload);if(error){console.error(error);q('#modalStatus').className='status err';q('#modalStatus').textContent='저장 실패';return}for(const box of q('#badges').querySelectorAll('[data-badge]')){const was=currentBadges.has(Number(box.dataset.bid)),now=box.checked;if(was!==now){await db.rpc('idp_admin_toggle_youth_badge',{p_youth_id:current.id,p_badge_code:box.dataset.badge,p_award:now})}}q('#modalStatus').className='status ok';q('#modalStatus').textContent='저장되었습니다.';await load()};q('#close').onclick=()=>q('#modal').classList.remove('show');q('#refresh').onclick=load;q('#logout').onclick=async()=>{await db.auth.signOut();enter(null)};db.auth.onAuthStateChange((_e,s)=>enter(s));db.auth.getSession().then(({data})=>enter(data.session))})();
</script><script src="../assets/js/version.js"></script></body></html>
