<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDP 게시판 관리자</title><link rel="stylesheet" href="../assets/css/idp-board.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><div class="wrap"><a class="brand" href="../index.html">IDP BOARD ADMIN<small>게시판 관리자</small></a><nav class="nav"><a href="../community/notice.html">공지</a><a href="../community/press.html">보도자료</a><a href="../index.html">홈</a></nav></div></header><main class="wrap"><section class="hero"><div class="kicker">HEADQUARTERS ONLY</div><h1>게시판 관리</h1><p>공지사항과 보도자료를 작성·수정·공개합니다.</p></section><div id="loginPanel" class="panel"><h3>관리자 이메일 인증</h3><div class="loginbox"><input id="email" class="input" type="email" value="jeonseongkweon@gmail.com"><button id="login" class="btn primary">인증메일 받기</button></div><div id="status" class="meta"></div></div><div id="dash" hidden class="admin-grid"><section class="panel"><input type="hidden" id="postId"><label>게시판</label><select id="boardType" class="select"><option value="notice">공지사항</option><option value="press">보도자료</option></select><label>제목</label><input id="title" class="input"><label>요약</label><textarea id="summary" class="textarea" rows="3"></textarea><label>본문</label><textarea id="content" class="textarea" rows="14"></textarea><label>작성자</label><input id="author" class="input" value="국제드론순찰대 본부"><label><input id="pinned" type="checkbox"> 중요글 고정</label><label><input id="published" type="checkbox" checked> 공개</label><div style="display:flex;gap:8px;margin-top:14px"><button id="save" class="btn primary">저장</button><button id="clear" class="btn">새 글</button><button id="out" class="btn">로그아웃</button></div></section><section class="panel"><h3>등록 글</h3><div id="posts" class="admin-list"></div></section></div></main><script src="../assets/js/idp-board.js"></script><script>
const ADMIN='jeonseongkweon@gmail.com';let me=null;function reset(){postId.value='';title.value='';summary.value='';content.value='';author.value='국제드론순찰대 본부';pinned.checked=false;published.checked=true}async function enter(){me=await session();const ok=me&&me.user.email.toLowerCase()===ADMIN;loginPanel.hidden=!!ok;dash.hidden=!ok;if(ok)load();else if(me){await idpdb.auth.signOut();status.textContent='관리자 계정만 사용할 수 있습니다.'}}login.onclick=async()=>{if(email.value.trim().toLowerCase()!==ADMIN)return status.textContent='관리자 이메일을 입력하세요.';const {error}=await otp(email.value.trim(),location.href);status.textContent=error?'발송 실패':'인증메일을 보냈습니다.'};out.onclick=logout;clear.onclick=reset;save.onclick=async()=>{const row={board_type:boardType.value,title:title.value.trim(),summary:summary.value.trim(),content:content.value.trim(),author_name:author.value.trim()||'IDP 본부',is_pinned:pinned.checked,is_published:published.checked,published_at:published.checked?new Date().toISOString():null};if(!row.title||!row.content)return alert('제목과 본문을 입력하세요.');let q=postId.value?idpdb.from('idp_board_posts').update(row).eq('id',postId.value):idpdb.from('idp_board_posts').insert(row);const {error}=await q;if(error)return alert('저장 실패: '+error.message);reset();load()};async function load(){const {data,error}=await idpdb.from('idp_board_posts').select('*').order('created_at',{ascending:false});if(error){posts.innerHTML='<div class="empty">불러오기 실패</div>';return}posts.innerHTML=(data||[]).map(x=>`<div class="admin-row"><div class="badge">${x.board_type==='press'?'보도자료':'공지'} ${x.is_published?'· 공개':'· 비공개'} ${x.is_pinned?'· 고정':''}</div><strong>${esc(x.title)}</strong><div class="meta">${fmt(x.created_at)} · 조회 ${x.view_count||0} · 공감 ${x.like_count||0} · 댓글 ${x.comment_count||0}</div><div style="margin-top:8px"><button class="btn" data-edit="${x.id}">수정</button> <button class="btn danger" data-del="${x.id}">삭제</button></div></div>`).join('');posts.onclick=async e=>{const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');if(ed){const x=data.find(z=>z.id===ed.dataset.edit);postId.value=x.id;boardType.value=x.board_type;title.value=x.title;summary.value=x.summary||'';content.value=x.content||'';author.value=x.author_name||'';pinned.checked=x.is_pinned;published.checked=x.is_published;scrollTo(0,0)}if(del&&confirm('삭제할까요?')){await idpdb.from('idp_board_posts').delete().eq('id',del.dataset.del);load()}}}enter();</script></body></html>
