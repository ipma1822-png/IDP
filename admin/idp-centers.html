<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>IDP 공식센터 관리</title><link rel="stylesheet" href="../assets/css/style.css"><style>
body{background:#070b11;color:#edf1f6}.admin{max-width:1320px;margin:auto;padding:35px 18px 80px}.box{background:#0d131d;border:1px solid #293345;border-radius:14px;padding:20px;margin-top:15px}.login{max-width:480px;margin:100px auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn,.tabs button{background:#111823;color:#e8edf5;border:1px solid #334052;border-radius:9px;padding:11px 14px;cursor:pointer;text-decoration:none}.gold,.tabs button.active{border-color:#b38f3d;color:#f0ce73}.panel{display:none}.panel.show{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,select,textarea{width:100%;box-sizing:border-box;background:#080c12;color:#fff;border:1px solid #334052;border-radius:8px;padding:11px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.84rem}th,td{padding:10px 8px;border-bottom:1px solid #273040;text-align:left;vertical-align:top}th{color:#d9ba64}.status{min-height:22px;color:#d9ba64}.pill{display:inline-block;padding:4px 7px;border-radius:99px;border:1px solid #3a475a;font-size:.72rem}@media(max-width:780px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="admin"><section id="login" class="box login"><h1>IDP 공식센터 관리</h1><p>관리자 이메일 인증 후 센터 신청을 승인할 수 있습니다.</p><form id="loginForm"><input id="email" type="email" required placeholder="관리자 이메일"><button class="btn gold" type="submit" style="margin-top:12px">인증 메일 받기</button></form><p id="loginStatus" class="status"></p></section><section id="dash" hidden><div class="top"><div><small style="color:#d9ba64">IDP OFFICIAL CENTER ADMIN</small><h1>지역 공식센터 통합관리</h1></div><div><a class="btn" href="index.html">관리자 홈</a> <button id="logout" class="btn">로그아웃</button></div></div><div class="tabs"><button class="active" data-tab="apps">센터 신청 심사</button><button data-tab="centers">승인센터 현황</button></div><div id="apps" class="panel show"><div class="box"><div class="grid"><input id="q" placeholder="지역·기관명·대표자 검색"><select id="filter"><option value="">전체 상태</option><option value="pending">심사중</option><option value="hold">보류</option><option value="rejected">반려</option><option value="approved">승인완료</option></select></div><div class="table-wrap"><table><thead><tr><th>접수</th><th>지역</th><th>기관</th><th>대표자</th><th>연락</th><th>계획</th><th>처리</th></tr></thead><tbody id="appBody"></tbody></table></div><p id="appStatus" class="status"></p></div></div><div id="centers" class="panel"><div class="box"><button id="reloadCenters" class="btn">새로고침</button><div class="table-wrap"><table><thead><tr><th>지정번호</th><th>지역</th><th>센터</th><th>센터장</th><th>기간</th><th>상태</th><th>관리</th></tr></thead><tbody id="centerBody"></tbody></table></div><p id="centerStatus" class="status"></p></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),ADMIN='jeonseongkweon@gmail.com', $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let apps=[];function dash(on){$('#login').hidden=on;$('#dash').hidden=!on}async function enter(session){if(!session){dash(false);return}if((session.user?.email||'').toLowerCase()!==ADMIN){await db.auth.signOut();dash(false);return}dash(true);await loadApps();await loadCenters()}$('#loginForm').onsubmit=async e=>{e.preventDefault();const email=$('#email').value.trim().toLowerCase();if(email!==ADMIN){$('#loginStatus').textContent='등록된 관리자 이메일을 입력해 주세요.';return}$('#loginStatus').textContent='인증 메일 발송 중...';const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:'https://idp.ai.kr/admin/idp-centers.html',shouldCreateUser:false}});$('#loginStatus').textContent=error?'인증 메일 발송 실패':'인증 메일을 보냈습니다.'};$('#logout').onclick=async()=>{await db.auth.signOut();dash(false)};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('show',x.id===b.dataset.tab))});async function loadApps(){const {data,error}=await db.from('idp_center_applications').select('*').order('created_at',{ascending:false});if(error){$('#appStatus').textContent='센터 SQL을 먼저 실행해 주세요.';return}apps=data||[];renderApps()}function renderApps(){const q=$('#q').value.trim().toLowerCase(),f=$('#filter').value;const list=apps.filter(x=>(!f||x.status===f)&&(!q||[x.sido,x.sigungu,x.eupmyeondong,x.center_name,x.director_name].join(' ').toLowerCase().includes(q)));$('#appBody').innerHTML=list.map(x=>`<tr><td>${new Date(x.created_at).toLocaleDateString('ko-KR')}</td><td><strong>${esc(x.sido)} ${esc(x.sigungu)} ${esc(x.eupmyeondong)}</strong><br><span class="pill">${esc(x.status)}</span></td><td>${esc(x.center_name)}<br><small>${esc(x.address)}</small></td><td>${esc(x.director_name)}</td><td>${esc(x.phone)}<br>${esc(x.email)}</td><td>${esc((x.plan||'').slice(0,70))}</td><td>${x.status==='approved'?'<span class="pill">승인완료</span>':`<button class="btn gold" data-approve="${x.id}">1년 승인</button> <button class="btn" data-hold="${x.id}">보류</button> <button class="btn" data-reject="${x.id}">반려</button>`}</td></tr>`).join('')||'<tr><td colspan="7">신청 내역이 없습니다.</td></tr>'}$('#q').oninput=renderApps;$('#filter').onchange=renderApps;$('#appBody').onclick=async e=>{const a=e.target.closest('[data-approve]'),h=e.target.closest('[data-hold]'),r=e.target.closest('[data-reject]');if(a){if(!confirm('이 지역의 공식센터로 1년 지정 승인하시겠습니까?'))return;const {data,error}=await db.rpc('idp_admin_approve_center',{p_application_id:Number(a.dataset.approve),p_valid_months:12});if(error){alert(error.message.includes('TERRITORY_TAKEN')?'이미 승인센터가 있는 지역입니다.':'승인 실패: '+error.message);return}alert('공식센터 승인 완료: '+data);await loadApps();await loadCenters()}else if(h||r){const id=Number((h||r).dataset[h?'hold':'reject']),status=h?'hold':'rejected';const {error}=await db.from('idp_center_applications').update({status,reviewed_at:new Date().toISOString()}).eq('id',id);if(error)alert('처리 실패');else await loadApps()}};async function loadCenters(){const {data,error}=await db.from('idp_official_centers').select('*').order('created_at',{ascending:false});if(error){$('#centerStatus').textContent='센터 목록을 불러오지 못했습니다.';return}$('#centerBody').innerHTML=(data||[]).map(x=>`<tr><td>${esc(x.center_code)}</td><td>${esc(x.sido)} ${esc(x.sigungu)} ${esc(x.eupmyeondong)}</td><td><strong>${esc(x.center_name)}</strong><br>${esc(x.address||'')}</td><td>${esc(x.director_name||'-')}</td><td>${esc(x.valid_from)} ~ ${esc(x.valid_until)}</td><td><select data-center-status="${x.id}"><option value="active" ${x.status==='active'?'selected':''}>운영중</option><option value="suspended" ${x.status==='suspended'?'selected':''}>갱신보류</option><option value="expired" ${x.status==='expired'?'selected':''}>만료</option><option value="revoked" ${x.status==='revoked'?'selected':''}>지정해제</option></select></td><td><button class="btn" data-save-center="${x.id}">저장</button></td></tr>`).join('')||'<tr><td colspan="7">승인센터가 없습니다.</td></tr>'}$('#centerBody').onclick=async e=>{const b=e.target.closest('[data-save-center]');if(!b)return;const id=Number(b.dataset.saveCenter),sel=document.querySelector(`[data-center-status="${id}"]`);const {error}=await db.from('idp_official_centers').update({status:sel.value,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert('저장 실패: '+error.message);else{alert('센터 상태를 저장했습니다.');await loadCenters()}};$('#reloadCenters').onclick=loadCenters;db.auth.onAuthStateChange((_e,s)=>enter(s));db.auth.getSession().then(({data})=>enter(data.session))})();
</script><script src="../assets/js/version.js"></script></body></html>
