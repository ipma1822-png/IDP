<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>IDP 봉사활동 관리</title><link rel="stylesheet" href="../assets/css/style.css"><style>body{background:#070b11;color:#eef2f7}.wrap{max-width:1450px;margin:auto;padding:100px 18px 60px}.panel{background:#0d131d;border:1px solid #293548;border-radius:18px;padding:20px;margin-bottom:16px}.login{max-width:520px;margin:70px auto}.field{display:grid;gap:6px;margin:9px 0}.field input,.field select,.field textarea{background:#080d14;border:1px solid #334055;border-radius:9px;color:white;padding:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{border:1px solid #344156;border-radius:9px;background:#121a26;color:white;padding:10px 13px;font-weight:850;cursor:pointer}.gold{background:#d1aa4d;color:#090d12;border:0}.dash{display:none}.dash.show{display:block}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:1180px}.table th,.table td{padding:10px;border-bottom:1px solid #253044;text-align:left}.table th{color:#9eaaba;font-size:.8rem}.qrbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qr{background:white;border-radius:13px;padding:12px;text-align:center;color:#111}.qr img{width:210px;height:210px;max-width:100%}.status{min-height:24px;color:#9da9b8}.ok{color:#8fe0a5}.err{color:#ff9f9f}@media(max-width:760px){.grid,.qrbox{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section id="login" class="panel login"><h2>IDP 봉사 관리자</h2><form id="loginForm"><label class="field">관리자 이메일<input id="email" type="email" required></label><button class="btn gold">인증 메일 받기</button><p id="loginStatus" class="status"></p></form></section><section id="dash" class="dash"><div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><small style="color:#d8b75f">IDP VOLUNTEER ADMIN</small><h1>봉사활동 · QR · 1365 관리</h1></div><div><button id="refresh" class="btn">새로고침</button> <button id="logout" class="btn">로그아웃</button></div></div></div><section class="panel"><h2>새 봉사활동 등록</h2><div class="grid"><label class="field">활동명<input id="title"></label><label class="field">공식센터<select id="center"><option value="">중앙/미지정</option></select></label><label class="field">모집인원<input id="capacity" type="number" min="0" value="30"></label><label class="field">시작일시<input id="start" type="datetime-local"></label><label class="field">종료일시<input id="end" type="datetime-local"></label><label class="field">장소<input id="location"></label><label class="field">대상<select id="target"><option value="KIDS,JUNIOR,YOUTH">KIDS/JUNIOR/YOUTH 전체</option><option value="KIDS">KIDS</option><option value="JUNIOR">JUNIOR</option><option value="YOUTH">YOUTH</option><option value="JUNIOR,YOUTH">JUNIOR/YOUTH</option></select></label><label class="field">1365 연계 예정<select id="link1365"><option value="false">아니오</option><option value="true">예</option></select></label><label class="field">상태<select id="pstatus"><option value="open">모집중</option><option value="draft">준비중</option></select></label></div><label class="field">활동내용<textarea id="description" rows="3"></textarea></label><button id="create" class="btn gold">활동 등록</button><p id="createStatus" class="status"></p></section><section class="panel"><h2>봉사활동 목록</h2><div class="table"><table><thead><tr><th>코드</th><th>활동명</th><th>일시</th><th>신청</th><th>1365</th><th>상태</th><th>관리</th></tr></thead><tbody id="programRows"></tbody></table></div></section><section id="detail" class="panel" style="display:none"><h2 id="detailTitle">활동 상세</h2><div class="qrbox"><div class="qr"><b>CHECK IN QR</b><div><img id="qrIn"></div><small id="urlIn"></small></div><div class="qr"><b>CHECK OUT QR</b><div><img id="qrOut"></div><small id="urlOut"></small></div></div><p><button id="rotate" class="btn">QR 토큰 재발급</button></p><div class="table"><table><thead><tr><th>YOUTH</th><th>구분</th><th>이름</th><th>체크인</th><th>체크아웃</th><th>확정시간</th><th>1365</th><th>증빙</th><th>처리</th></tr></thead><tbody id="appRows"></tbody></table></div><p id="detailStatus" class="status"></p></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),ADMIN='jeonseongkweon@gmail.com',q=s=>document.querySelector(s);let programs=[],centers=[],current=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>v?new Date(v).toLocaleString('ko-KR'):'-';async function enter(session){if(!session||String(session.user?.email||'').toLowerCase()!==ADMIN){q('#login').style.display='block';q('#dash').classList.remove('show');return}q('#login').style.display='none';q('#dash').classList.add('show');await load()}q('#loginForm').onsubmit=async e=>{e.preventDefault();const email=q('#email').value.trim().toLowerCase();if(email!==ADMIN){q('#loginStatus').textContent='관리자 이메일을 입력해 주세요.';return}const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:'https://idp.ai.kr/admin/idp-volunteer.html',shouldCreateUser:false}});q('#loginStatus').textContent=error?'인증메일 발송 실패':'인증메일을 보냈습니다.'};async function load(){const [p,c]=await Promise.all([db.rpc('idp_admin_list_volunteer_programs'),db.rpc('idp_list_youth_centers')]);programs=p.data||[];centers=c.data||[];q('#center').innerHTML='<option value="">중앙/미지정</option>'+centers.map(x=>`<option value="${x.center_id}">${esc(x.sido)} ${esc(x.sigungu)} ${esc(x.eupmyeondong)} · ${esc(x.center_name)}</option>`).join('');q('#programRows').innerHTML=programs.map(x=>`<tr><td>${esc(x.program_code)}</td><td>${esc(x.title)}</td><td>${dt(x.start_at)}</td><td>${Number(x.application_count||0)}</td><td>${x.link_1365?'연계':'미연계'}</td><td>${esc(x.status)}</td><td><button class="btn" data-open="${x.id}">열기</button></td></tr>`).join('');q('#programRows').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openProgram(Number(b.dataset.open)))}q('#create').onclick=async()=>{q('#createStatus').textContent='등록 중...';const {data,error}=await db.rpc('idp_admin_create_volunteer_program',{p_title:q('#title').value.trim(),p_center_id:q('#center').value?Number(q('#center').value):null,p_start_at:q('#start').value?new Date(q('#start').value).toISOString():null,p_end_at:q('#end').value?new Date(q('#end').value).toISOString():null,p_location:q('#location').value.trim(),p_capacity:Number(q('#capacity').value||0),p_target_groups:q('#target').value,p_link_1365:q('#link1365').value==='true',p_status:q('#pstatus').value,p_description:q('#description').value.trim()});if(error){console.error(error);q('#createStatus').textContent='등록 실패 · 필수항목을 확인해 주세요.';return}q('#createStatus').textContent='등록완료 · '+data;await load()};async function openProgram(id){current=programs.find(x=>x.id===id);if(!current)return;q('#detail').style.display='block';q('#detailTitle').textContent=current.title+' · '+current.program_code;renderQR();const {data,error}=await db.rpc('idp_admin_list_volunteer_applications',{p_program_id:id});if(error){console.error(error);q('#detailStatus').textContent='참가자 조회 실패';return}const arr=data||[];q('#appRows').innerHTML=arr.map(a=>`<tr><td>${esc(a.youth_code)}</td><td>${esc(a.group_type)}</td><td>${esc(a.name)}</td><td>${dt(a.check_in_at)}</td><td>${dt(a.check_out_at)}</td><td><input data-hours="${a.application_id}" type="number" min="0" step="0.5" value="${Number(a.approved_hours||0)}" style="width:75px"></td><td><select data-1365="${a.application_id}"><option value="not_linked" ${a.status_1365==='not_linked'?'selected':''}>미연계</option><option value="pending" ${a.status_1365==='pending'?'selected':''}>등록대기</option><option value="completed" ${a.status_1365==='completed'?'selected':''}>등록완료</option><option value="rejected" ${a.status_1365==='rejected'?'selected':''}>반려</option><option value="needs_fix" ${a.status_1365==='needs_fix'?'selected':''}>수정필요</option></select></td><td><input data-file="${a.application_id}" type="file" accept="image/*" style="max-width:170px"></td><td><button class="btn" data-save="${a.application_id}">승인저장</button></td></tr>`).join('');q('#appRows').querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveApp(Number(b.dataset.save)))}function renderQR(){const base='https://idp.ai.kr/pages/volunteer-check.html',uIn=`${base}?p=${encodeURIComponent(current.program_code)}&m=in&t=${encodeURIComponent(current.checkin_token)}`,uOut=`${base}?p=${encodeURIComponent(current.program_code)}&m=out&t=${encodeURIComponent(current.checkout_token)}`;q('#urlIn').textContent=uIn;q('#urlOut').textContent=uOut;q('#qrIn').src='https://quickchart.io/qr?size=240&text='+encodeURIComponent(uIn);q('#qrOut').src='https://quickchart.io/qr?size=240&text='+encodeURIComponent(uOut)}async function saveApp(id){q('#detailStatus').textContent='저장 중...';const hours=Number(document.querySelector(`[data-hours="${id}"]`).value||0),st=document.querySelector(`[data-1365="${id}"]`).value,file=document.querySelector(`[data-file="${id}"]`).files[0];let evidencePath=null;if(file){const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase(),path=`${current.program_code}/${id}-${Date.now()}.${ext}`;const up=await db.storage.from('idp-volunteer-evidence').upload(path,file,{upsert:false});if(up.error){console.error(up.error);q('#detailStatus').textContent='증빙사진 업로드 실패';return}evidencePath=path}const {error}=await db.rpc('idp_admin_approve_volunteer_record',{p_application_id:id,p_approved_hours:hours,p_1365_status:st,p_evidence_path:evidencePath});if(error){console.error(error);q('#detailStatus').textContent='승인 저장 실패';return}q('#detailStatus').textContent='활동시간·1365 상태·증빙 저장 완료';await openProgram(current.id)}q('#rotate').onclick=async()=>{if(!current)return;const {error}=await db.rpc('idp_admin_rotate_volunteer_tokens',{p_program_id:current.id});if(error){q('#detailStatus').textContent='QR 재발급 실패';return}await load();current=programs.find(x=>x.id===current.id);renderQR();q('#detailStatus').textContent='새 QR 토큰이 발급되었습니다.'};q('#refresh').onclick=load;q('#logout').onclick=async()=>{await db.auth.signOut();enter(null)};db.auth.onAuthStateChange((_e,s)=>enter(s));db.auth.getSession().then(({data})=>enter(data.session))})();
</script><script src="../assets/js/version.js"></script></body></html>
