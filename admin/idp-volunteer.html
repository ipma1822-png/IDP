<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>IDP 봉사활동 통합관리</title><link rel="stylesheet" href="../assets/css/style.css">
<style>
body{background:#070b11;color:#eef2f7}.wrap{max-width:1500px;margin:auto;padding:100px 18px 60px}.panel{background:#0d131d;border:1px solid #293548;border-radius:18px;padding:20px;margin-bottom:16px}.login{max-width:520px;margin:70px auto}.field{display:grid;gap:6px;margin:9px 0}.field input,.field select,.field textarea{background:#080d14;border:1px solid #334055;border-radius:9px;color:white;padding:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:1px solid #344156;border-radius:9px;background:#121a26;color:white;padding:10px 13px;font-weight:850;cursor:pointer}.gold{background:#d1aa4d;color:#090d12;border:0}.blue{background:#17345f}.green{background:#153d2a}.dash{display:none}.dash.show{display:block}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:1180px}.table th,.table td{padding:10px;border-bottom:1px solid #253044;text-align:left}.table th{color:#9eaaba;font-size:.8rem}.qrbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qr{background:white;border-radius:13px;padding:12px;text-align:center;color:#111}.qr img{width:210px;height:210px;max-width:100%}.status{min-height:24px;color:#9da9b8}.ok{color:#8fe0a5}.err{color:#ff9f9f}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.stat{background:#09111b;border:1px solid #26364b;border-radius:13px;padding:14px}.stat strong{font-size:1.35rem;display:block}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.report-preview{background:white;color:#111;border-radius:14px;padding:28px;margin-top:15px}.report-preview h2{text-align:center}.muted{color:#9da9b8}.badge{display:inline-block;border:1px solid #3a4c66;border-radius:999px;padding:4px 9px;font-size:.78rem}.pending{color:#ffd984}.completed{color:#91e7a9}@media(max-width:900px){.grid,.grid2,.stats,.qrbox{grid-template-columns:1fr}.wrap{padding-top:80px}}
@media print{body{background:#fff;color:#000}.wrap>*:not(#dash),#login,.panel:not(#detail){display:none!important}#dash{display:block!important}#detail{border:0;background:#fff;color:#000;padding:0}.qrbox,.table,.toolbar,#detailStatus,#reportEdit{display:none!important}.report-preview{display:block!important;box-shadow:none;margin:0;padding:0}}
</style></head>
<body><main class="wrap">
<section id="login" class="panel login"><h2>IDP 봉사 관리자</h2><form id="loginForm"><label class="field">관리자 이메일<input id="email" type="email" required></label><button class="btn gold">인증 메일 받기</button><p id="loginStatus" class="status"></p></form></section>
<section id="dash" class="dash">
<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><small style="color:#d8b75f">IDP VOLUNTEER ADMIN v4.6</small><h1>봉사활동 · 결과보고 · 1365 통합관리</h1></div><div><button id="refresh" class="btn">새로고침</button> <button id="logout" class="btn">로그아웃</button></div></div></div>

<section class="panel"><h2>새 봉사활동 등록</h2><div class="grid"><label class="field">활동명<input id="title"></label><label class="field">공식센터<select id="center"><option value="">중앙/미지정</option></select></label><label class="field">모집인원<input id="capacity" type="number" min="0" value="30"></label><label class="field">시작일시<input id="start" type="datetime-local"></label><label class="field">종료일시<input id="end" type="datetime-local"></label><label class="field">장소<input id="location"></label><label class="field">대상<select id="target"><option value="KIDS,JUNIOR,YOUTH">KIDS/JUNIOR/YOUTH 전체</option><option value="KIDS">KIDS</option><option value="JUNIOR">JUNIOR</option><option value="YOUTH">YOUTH</option><option value="JUNIOR,YOUTH">JUNIOR/YOUTH</option></select></label><label class="field">1365 연계 예정<select id="link1365"><option value="false">아니오</option><option value="true">예</option></select></label><label class="field">상태<select id="pstatus"><option value="open">모집중</option><option value="draft">준비중</option></select></label></div><label class="field">활동내용<textarea id="description" rows="3"></textarea></label><button id="create" class="btn gold">활동 등록</button><p id="createStatus" class="status"></p></section>

<section class="panel"><h2>센터·기간별 봉사실적 출력</h2><div class="grid"><label class="field">공식센터<select id="exportCenter"><option value="">전국/전체센터</option></select></label><label class="field">시작일<input id="exportFrom" type="date"></label><label class="field">종료일<input id="exportTo" type="date"></label></div><div class="toolbar"><button id="exportCsv" class="btn green">CSV 내려받기</button><button id="exportXlsx" class="btn green">Excel 내려받기</button><button id="pending1365" class="btn blue">1365 등록대기자 보기</button><button id="pendingCsv" class="btn">1365 대기목록 CSV</button></div><p id="exportStatus" class="status"></p><div id="pendingPanel" class="table" style="display:none"><table><thead><tr><th>센터</th><th>YOUTH</th><th>이름</th><th>활동</th><th>활동일</th><th>확정시간</th><th>1365</th></tr></thead><tbody id="pendingRows"></tbody></table></div></section>

<section class="panel"><h2>봉사활동 목록</h2><div class="table"><table><thead><tr><th>코드</th><th>활동명</th><th>센터</th><th>일시</th><th>신청</th><th>1365</th><th>상태</th><th>관리</th></tr></thead><tbody id="programRows"></tbody></table></div></section>

<section id="detail" class="panel" style="display:none"><h2 id="detailTitle">활동 상세</h2><div id="detailStats" class="stats"></div><div class="toolbar"><button id="printReport" class="btn gold">결과보고서 인쇄/PDF</button><button id="downloadPhotos" class="btn green">활동사진 전체 ZIP</button><button id="rotate" class="btn">QR 토큰 재발급</button></div>
<div class="qrbox"><div class="qr"><b>CHECK IN QR</b><div><img id="qrIn"></div><small id="urlIn"></small></div><div class="qr"><b>CHECK OUT QR</b><div><img id="qrOut"></div><small id="urlOut"></small></div></div>
<div class="table"><table><thead><tr><th>YOUTH</th><th>구분</th><th>이름</th><th>체크인</th><th>체크아웃</th><th>확정시간</th><th>1365</th><th>증빙</th><th>처리</th></tr></thead><tbody id="appRows"></tbody></table></div><p id="detailStatus" class="status"></p>

<div id="reportEdit"><h3>활동 결과보고서</h3><div class="grid2"><label class="field">담당자<input id="reportManager"></label><label class="field">협력기관<input id="reportPartner"></label></div><label class="field">활동 결과 요약<textarea id="reportSummary" rows="4" placeholder="참여인원, 주요 활동, 안전성과 등을 기록"></textarea></label><label class="field">성과·특이사항<textarea id="reportResult" rows="4" placeholder="성과, 개선점, 다음 활동 계획 등을 기록"></textarea></label><button id="saveReport" class="btn gold">결과보고 저장</button></div>
<div id="reportPreview" class="report-preview"></div>
</section>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(()=>{const db=window.supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),ADMIN='jeonseongkweon@gmail.com',q=s=>document.querySelector(s);let programs=[],centers=[],current=null,currentApps=[],currentReport=null,pendingData=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=v=>v?new Date(v).toLocaleString('ko-KR'):'-';const d=v=>v?new Date(v).toLocaleDateString('ko-KR'):'-';const csvCell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';function downloadBlob(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function enter(session){if(!session||String(session.user?.email||'').toLowerCase()!==ADMIN){q('#login').style.display='block';q('#dash').classList.remove('show');return}q('#login').style.display='none';q('#dash').classList.add('show');await load()}
q('#loginForm').onsubmit=async e=>{e.preventDefault();const email=q('#email').value.trim().toLowerCase();if(email!==ADMIN){q('#loginStatus').textContent='관리자 이메일을 입력해 주세요.';return}const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:'https://idp.ai.kr/admin/idp-volunteer.html',shouldCreateUser:false}});q('#loginStatus').textContent=error?'인증메일 발송 실패':'인증메일을 보냈습니다.'};
async function load(){const [p,c]=await Promise.all([db.rpc('idp_admin_list_volunteer_programs'),db.rpc('idp_list_youth_centers')]);programs=p.data||[];centers=c.data||[];const opts='<option value="">중앙/미지정</option>'+centers.map(x=>`<option value="${x.center_id}">${esc(x.sido)} ${esc(x.sigungu)} ${esc(x.eupmyeondong)} · ${esc(x.center_name)}</option>`).join('');q('#center').innerHTML=opts;q('#exportCenter').innerHTML='<option value="">전국/전체센터</option>'+centers.map(x=>`<option value="${x.center_id}">${esc(x.sido)} ${esc(x.sigungu)} ${esc(x.eupmyeondong)} · ${esc(x.center_name)}</option>`).join('');q('#programRows').innerHTML=programs.map(x=>`<tr><td>${esc(x.program_code)}</td><td>${esc(x.title)}</td><td>${esc(x.center_name||'중앙')}</td><td>${dt(x.start_at)}</td><td>${Number(x.application_count||0)}</td><td>${x.link_1365?'연계':'미연계'}</td><td>${esc(x.status)}</td><td><button class="btn" data-open="${x.id}">열기</button></td></tr>`).join('');q('#programRows').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openProgram(Number(b.dataset.open)))}
q('#create').onclick=async()=>{q('#createStatus').textContent='등록 중...';const {data,error}=await db.rpc('idp_admin_create_volunteer_program',{p_title:q('#title').value.trim(),p_center_id:q('#center').value?Number(q('#center').value):null,p_start_at:q('#start').value?new Date(q('#start').value).toISOString():null,p_end_at:q('#end').value?new Date(q('#end').value).toISOString():null,p_location:q('#location').value.trim(),p_capacity:Number(q('#capacity').value||0),p_target_groups:q('#target').value,p_link_1365:q('#link1365').value==='true',p_status:q('#pstatus').value,p_description:q('#description').value.trim()});if(error){console.error(error);q('#createStatus').textContent='등록 실패 · 필수항목을 확인해 주세요.';return}q('#createStatus').textContent='등록완료 · '+data;await load()};
async function openProgram(id){current=programs.find(x=>x.id===id);if(!current)return;q('#detail').style.display='block';q('#detailTitle').textContent=current.title+' · '+current.program_code;renderQR();const [apps,rep]=await Promise.all([db.rpc('idp_admin_list_volunteer_applications',{p_program_id:id}),db.rpc('idp_admin_get_volunteer_report',{p_program_id:id})]);if(apps.error||rep.error){console.error(apps.error||rep.error);q('#detailStatus').textContent='활동 상세 조회 실패';return}currentApps=apps.data||[];currentReport=(rep.data||[])[0]||{};renderApps();renderReport();q('#detail').scrollIntoView({behavior:'smooth',block:'start'})}
function renderApps(){q('#appRows').innerHTML=currentApps.map(a=>`<tr><td>${esc(a.youth_code)}</td><td>${esc(a.group_type)}</td><td>${esc(a.name)}</td><td>${dt(a.check_in_at)}</td><td>${dt(a.check_out_at)}</td><td><input data-hours="${a.application_id}" type="number" min="0" step="0.5" value="${Number(a.approved_hours||0)}" style="width:75px"></td><td><select data-1365="${a.application_id}"><option value="not_linked" ${a.status_1365==='not_linked'?'selected':''}>미연계</option><option value="pending" ${a.status_1365==='pending'?'selected':''}>등록대기</option><option value="completed" ${a.status_1365==='completed'?'selected':''}>등록완료</option><option value="rejected" ${a.status_1365==='rejected'?'selected':''}>반려</option><option value="needs_fix" ${a.status_1365==='needs_fix'?'selected':''}>수정필요</option></select></td><td>${Number(a.evidence_count||0)}장<br><input data-file="${a.application_id}" type="file" accept="image/*" style="max-width:170px"></td><td><button class="btn" data-save="${a.application_id}">승인저장</button></td></tr>`).join('');q('#appRows').querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveApp(Number(b.dataset.save)))}
function renderReport(){const r=currentReport;q('#reportManager').value=r.report_manager||'';q('#reportPartner').value=r.report_partner||'';q('#reportSummary').value=r.report_summary||'';q('#reportResult').value=r.report_result||'';q('#detailStats').innerHTML=`<div class="stat"><span>신청인원</span><strong>${Number(r.application_count||0)}</strong></div><div class="stat"><span>승인인원</span><strong>${Number(r.approved_count||0)}</strong></div><div class="stat"><span>총 봉사시간</span><strong>${Number(r.total_hours||0).toFixed(1)}</strong></div><div class="stat"><span>1365 완료</span><strong>${Number(r.completed_1365_count||0)}</strong></div><div class="stat"><span>증빙사진</span><strong>${Number(r.evidence_count||0)}</strong></div>`;q('#reportPreview').innerHTML=`<h2>국제드론순찰대(IDP) 봉사활동 결과보고서</h2><p><b>활동명</b> ${esc(r.title||current.title)}</p><p><b>활동코드</b> ${esc(r.program_code||current.program_code)}</p><p><b>공식센터</b> ${esc(r.center_name||'IDP 중앙')}</p><p><b>일시</b> ${dt(r.start_at)} ~ ${dt(r.end_at)}</p><p><b>장소</b> ${esc(r.location||'-')}</p><p><b>담당자</b> ${esc(r.report_manager||'-')} &nbsp; <b>협력기관</b> ${esc(r.report_partner||'-')}</p><hr><p><b>신청 ${Number(r.application_count||0)}명 / 승인 ${Number(r.approved_count||0)}명 / 총 봉사 ${Number(r.total_hours||0).toFixed(1)}시간 / 1365 완료 ${Number(r.completed_1365_count||0)}명 / 증빙 ${Number(r.evidence_count||0)}장</b></p><h3>활동 결과 요약</h3><p style="white-space:pre-wrap">${esc(r.report_summary||'미작성')}</p><h3>성과·특이사항</h3><p style="white-space:pre-wrap">${esc(r.report_result||'미작성')}</p><p style="margin-top:40px;text-align:right">보고서 생성: ${new Date().toLocaleString('ko-KR')}</p>`}
function renderQR(){const base='https://idp.ai.kr/pages/volunteer-check.html',uIn=`${base}?p=${encodeURIComponent(current.program_code)}&m=in&t=${encodeURIComponent(current.checkin_token)}`,uOut=`${base}?p=${encodeURIComponent(current.program_code)}&m=out&t=${encodeURIComponent(current.checkout_token)}`;q('#urlIn').textContent=uIn;q('#urlOut').textContent=uOut;q('#qrIn').src='https://quickchart.io/qr?size=240&text='+encodeURIComponent(uIn);q('#qrOut').src='https://quickchart.io/qr?size=240&text='+encodeURIComponent(uOut)}
async function saveApp(id){q('#detailStatus').textContent='저장 중...';const hours=Number(document.querySelector(`[data-hours="${id}"]`).value||0),st=document.querySelector(`[data-1365="${id}"]`).value,file=document.querySelector(`[data-file="${id}"]`).files[0];let evidencePath=null;if(file){const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase(),path=`${current.program_code}/${id}-${Date.now()}.${ext}`;const up=await db.storage.from('idp-volunteer-evidence').upload(path,file,{upsert:false});if(up.error){console.error(up.error);q('#detailStatus').textContent='증빙사진 업로드 실패';return}evidencePath=path}const {error}=await db.rpc('idp_admin_approve_volunteer_record_v46',{p_application_id:id,p_approved_hours:hours,p_1365_status:st,p_evidence_path:evidencePath});if(error){console.error(error);q('#detailStatus').textContent='승인 저장 실패';return}q('#detailStatus').textContent='승인·XP·LEVEL·1365·센터실적 반영 완료';await openProgram(current.id);await load()}
q('#saveReport').onclick=async()=>{if(!current)return;q('#detailStatus').textContent='결과보고 저장 중...';const {error}=await db.rpc('idp_admin_save_volunteer_report',{p_program_id:current.id,p_report_manager:q('#reportManager').value.trim(),p_report_partner:q('#reportPartner').value.trim(),p_report_summary:q('#reportSummary').value.trim(),p_report_result:q('#reportResult').value.trim()});if(error){console.error(error);q('#detailStatus').textContent='결과보고 저장 실패';return}q('#detailStatus').textContent='결과보고서 저장 완료';await openProgram(current.id)};
q('#printReport').onclick=()=>window.print();
q('#downloadPhotos').onclick=async()=>{if(!current)return;q('#detailStatus').textContent='활동사진 묶음 생성 중...';const {data,error}=await db.rpc('idp_admin_list_volunteer_evidence',{p_program_id:current.id});if(error){console.error(error);q('#detailStatus').textContent='증빙 목록 조회 실패';return}const arr=data||[];if(!arr.length){q('#detailStatus').textContent='등록된 증빙사진이 없습니다.';return}const zip=new JSZip();let ok=0;for(const e of arr){const dl=await db.storage.from('idp-volunteer-evidence').download(e.storage_path);if(dl.error)continue;const safe=String(e.name||e.youth_code||'member').replace(/[\\/:*?"<>|]/g,'_');const ext=(e.storage_path.split('.').pop()||'jpg');zip.file(`${String(ok+1).padStart(2,'0')}_${safe}_${e.youth_code}.${ext}`,dl.data);ok++}if(!ok){q('#detailStatus').textContent='다운로드 가능한 사진이 없습니다.';return}const blob=await zip.generateAsync({type:'blob'});downloadBlob(`${current.program_code}_활동사진_${ok}장.zip`,blob);q('#detailStatus').textContent=`활동사진 ${ok}장 ZIP 생성 완료`};
async function fetchExport(){const from=q('#exportFrom').value||null,to=q('#exportTo').value||null,center=q('#exportCenter').value?Number(q('#exportCenter').value):null;const {data,error}=await db.rpc('idp_admin_export_volunteer_records',{p_center_id:center,p_date_from:from,p_date_to:to});if(error){console.error(error);q('#exportStatus').textContent='실적 조회 실패';return []}return data||[]}
function rowsForExport(arr){return arr.map(x=>({'센터':x.center_name||'IDP 중앙','YOUTH번호':x.youth_code,'구분':x.group_type,'이름':x.name,'활동코드':x.program_code,'활동명':x.title,'활동일':d(x.start_at),'장소':x.location||'','체크인':dt(x.check_in_at),'체크아웃':dt(x.check_out_at),'확정시간':Number(x.approved_hours||0),'1365상태':x.status_1365,'증빙수':Number(x.evidence_count||0)}))}
q('#exportCsv').onclick=async()=>{const arr=rowsForExport(await fetchExport());if(!arr.length){q('#exportStatus').textContent='출력할 실적이 없습니다.';return}const keys=Object.keys(arr[0]),csv='\ufeff'+[keys.map(csvCell).join(','),...arr.map(r=>keys.map(k=>csvCell(r[k])).join(','))].join('\r\n');downloadBlob(`IDP_봉사실적_${q('#exportFrom').value||'전체'}_${q('#exportTo').value||'전체'}.csv`,new Blob([csv],{type:'text/csv;charset=utf-8'}));q('#exportStatus').textContent=`CSV ${arr.length}건 생성 완료`};
q('#exportXlsx').onclick=async()=>{const arr=rowsForExport(await fetchExport());if(!arr.length){q('#exportStatus').textContent='출력할 실적이 없습니다.';return}const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(arr);XLSX.utils.book_append_sheet(wb,ws,'봉사실적');XLSX.writeFile(wb,`IDP_봉사실적_${q('#exportFrom').value||'전체'}_${q('#exportTo').value||'전체'}.xlsx`);q('#exportStatus').textContent=`Excel ${arr.length}건 생성 완료`};
async function loadPending(){const center=q('#exportCenter').value?Number(q('#exportCenter').value):null,{data,error}=await db.rpc('idp_admin_list_1365_pending',{p_center_id:center});if(error){console.error(error);q('#exportStatus').textContent='1365 대기목록 조회 실패';return []}pendingData=data||[];q('#pendingPanel').style.display='block';q('#pendingRows').innerHTML=pendingData.map(x=>`<tr><td>${esc(x.center_name||'중앙')}</td><td>${esc(x.youth_code)}</td><td>${esc(x.name)}</td><td>${esc(x.title)}</td><td>${d(x.start_at)}</td><td>${Number(x.approved_hours||0).toFixed(1)}</td><td><span class="badge pending">등록대기</span></td></tr>`).join('');q('#exportStatus').textContent=`1365 등록대기 ${pendingData.length}건`;return pendingData}
q('#pending1365').onclick=loadPending;q('#pendingCsv').onclick=async()=>{const arr=(await loadPending()).map(x=>({'센터':x.center_name||'IDP 중앙','YOUTH번호':x.youth_code,'구분':x.group_type,'이름':x.name,'생년월일':x.birth_date||'','보호자':x.guardian_name||'','보호자연락처':x.guardian_phone||'','활동코드':x.program_code,'활동명':x.title,'활동일':d(x.start_at),'확정시간':Number(x.approved_hours||0),'1365상태':'등록대기'}));if(!arr.length)return;const keys=Object.keys(arr[0]),csv='\ufeff'+[keys.map(csvCell).join(','),...arr.map(r=>keys.map(k=>csvCell(r[k])).join(','))].join('\r\n');downloadBlob(`IDP_1365_등록대기_${new Date().toISOString().slice(0,10)}.csv`,new Blob([csv],{type:'text/csv;charset=utf-8'}))};
q('#rotate').onclick=async()=>{if(!current)return;const {error}=await db.rpc('idp_admin_rotate_volunteer_tokens',{p_program_id:current.id});if(error){q('#detailStatus').textContent='QR 재발급 실패';return}await load();current=programs.find(x=>x.id===current.id);renderQR();q('#detailStatus').textContent='새 QR 토큰이 발급되었습니다.'};q('#refresh').onclick=load;q('#logout').onclick=async()=>{await db.auth.signOut();enter(null)};db.auth.onAuthStateChange((_e,s)=>enter(s));db.auth.getSession().then(({data})=>enter(data.session))})();
</script><script src="../assets/js/version.js"></script></body></html>
